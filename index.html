<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* NEW: Fix for fullscreen white line */
        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /* Ensure the video player is a background element */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            z-index: -10;
            pointer-events: none;
            /* Allows clicking through the video */
            object-fit: cover;
            /* Ensures video covers the screen */
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            /* Hide scrollbars */
        }

        /* Custom styles for text shadow to make text readable on any background */
        .text-shadow {
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* Top-right: time left until next hour */
        #top-hour-left {}

        #top-hour-left-text {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.92);
        }

        /* Style for the progress bar */
        .progress-bar {
            height: 2px;
            background-color: rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            background-color: white;
            width: 100%;
            transition: width 0.5s ease;
        }

        /* --- REMOVED To-Do List Styles --- */

        /* --- Add/Subtract Time Button Styles --- */
        #timer-wrapper {
            position: relative;
        }

        .time-adjust-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3rem;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 1rem;
            opacity: 0;
            /* Hidden by default */
            transition: opacity 0.2s ease-in-out, color 0.2s ease-in-out;
            user-select: none;
            /* Prevent text selection */
        }

        .time-adjust-btn:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        #timer-wrapper:hover .time-adjust-btn {
            opacity: 1;
            /* Show on hover */
        }

        #subtract-time-btn {
            left: -80px;
        }

        #add-time-btn {
            right: -80px;
        }

        /* --- REMOVED Minimize Styles --- */
        .control-btn {
            transition: all 0.3s ease;
        }

        /* --- REMOVED Chat Modal Styles --- */

        /* --- Video Seek Bar Styles --- */
        #video-seek-bar {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            transition: height 0.2s ease;
        }

        #video-seek-bar:hover {
            height: 10px;
            /* Make it easier to click */
        }

        #video-seek-bar::-webkit-progress-bar {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        #video-seek-bar::-webkit-progress-value {
            background: white;
            border-radius: 3px;
        }

        #video-seek-bar::-moz-progress-bar {
            background: white;
            border-radius: 3px;
        }

        /* --- REMOVED: Draggable Timer Styles --- */

        /* --- Resizable Timer Style --- */
        #timer-display {
            /* Use CSS variable for font size, default to 10rem */
            font-size: var(--timer-font-size, 10rem);
        }

        /* --- NEW: Editable Subtext Style --- */
        #custom-text-input {
            font-size: var(--timer-subtext-font-size, 2rem);
            /* Default to 2rem */
            font-family: 'serif';
            /* Aesthetic font */
            font-style: italic;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            opacity: 0.8;
            background-color: transparent;
            border: none;
            outline: none;
            text-align: center;
            width: 100%;
            max-width: 600px;
            /* Limit width */
            margin-top: 0.5rem;
            /* Space from progress bar */
        }

        #custom-text-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }


        /* --- UI Hide Style (for Cinema and Minimize) --- */
        .ui-hide {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 0.3s ease-out;
        }
    </style>
</head>

<body class="bg-black text-white">

    <!-- 1. Local Video Background -->
    <video id="bg-video" muted loop playsinline autoplay></video>
    <!-- NEW: YouTube Background Container -->
    <div id="youtube-bg"
        style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);min-width:100%;min-height:100%;z-index:-10;pointer-events:none;">
    </div>


    <!-- Hidden file input for video selection -->
    <input type="file" id="video-file-input" accept="video/*" class="hidden">

    <!-- 2. Top Right Stats Display -->
    <div id="stats-display" class="fixed top-4 right-6 z-20 text-right text-shadow transition-opacity duration-300">
        <div class="text-lg font-semibold">Today's Focus</div>
        <div id="stats-study" class="text-base">0m 0s</div>
        <div class="text-lg font-semibold mt-2">Today's Break</div>
        <div id="stats-break" class="text-base">0m 0s</div>

        <!-- NEW: Top-right time-left-until-hour -->
        <div id="top-hour-left" class="mt-3 text-right">
            <div id="top-hour-left-text" class="text-sm font-medium text-shadow"></div>
        </div>
    </div>

    <!-- 3. Main Content: Timer and Clock -->
    <!-- MODIFIED: Wrapper div is now centered and no longer draggable -->
    <div id="timer-ui-container" class="flex flex-col justify-center items-center h-full w-full relative z-10">

        <!-- Current Mode Display -->
        <div id="current-mode-display" class="text-3xl font-serif italic text-shadow opacity-80 mb-2">
            <!-- This will be filled by JavaScript -->
        </div>

        <!-- Timer Display -->
        <div id="timer-wrapper" class="relative">
            <div id="timer-container" class="text-center">
                <!-- MODIFIED: Removed text-[10rem] class -->
                <div id="timer-display" class="font-bold text-shadow tracking-tight">
                    25:00
                </div>
                <div class="progress-bar mt-4">
                    <div id="progress-bar-inner" class="progress-bar-inner"></div>
                </div>
                <!-- NEW: Editable Text Input -->
                <input type="text" id="custom-text-input" placeholder="What are you working on?">
            </div>
            <!-- Add/Subtract Time Buttons -->
            <button id="subtract-time-btn" class="time-adjust-btn" title="Subtract 5 minutes">-</button>
            <button id="add-time-btn" class="time-adjust-btn" title="Add 5 minutes">+</button>
        </div>

        <!-- (center clock removed — top-right now displays hour-left) -->

        <!-- REMOVED: Set Position Button -->

    </div>

    <!-- REMOVED: Last Video Reminder -->

    <!-- Video Controls Container -->
    <div id="video-controls-container" class="fixed bottom-32 left-1/2 -translate-x-1/2 w-full max-w-xl z-20 hidden">
        <div class="flex items-center space-x-4 bg-black/30 backdrop-blur-md p-3 rounded-full shadow-lg mx-auto w-full">
            <!-- NEW: Video Play/Pause Button -->
            <button id="video-play-pause-btn" title="Play/Pause Video"
                class="p-1 text-white/80 hover:text-white rounded-full transition-all">
                <svg id="video-play-icon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                        clip-rule="evenodd"></path>
                </svg>
                <svg id="video-pause-icon" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h1a1 1 0 001-1V8a1 1 0 00-1-1H8zm5 0a1 1 0 00-1 1v4a1 1 0 001 1h1a1 1 0 001-1V8a1 1 0 00-1-1h-1z"
                        clip-rule="evenodd"></path>
                </svg>
            </button>
            <span id="video-time-display" class="text-sm text-white/80 font-mono w-28 text-center">00:00 / 00:00</span>
            <progress id="video-seek-bar" value="0" max="100" class="flex-grow"></progress>
        </div>
    </div>


    <!-- 4. Bottom Controls -->
    <div id="controls-bar"
        class="fixed bottom-0 left-0 w-full flex justify-center p-6 z-20 transition-opacity duration-300">
        <div class="flex items-center space-x-2 bg-black/30 backdrop-blur-md p-3 rounded-full shadow-lg">
            <!-- Minimize UI -->
            <button id="minimize-btn" title="Minimize UI (Click anywhere to exit)"
                class="p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg id="minimize-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
                <!-- REMOVED Maximize Icon -->
            </button>
            <!-- NEW: Cinema Mode Button -->
            <button id="cinema-mode-btn" title="Cinema Mode (Click anywhere to exit)"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.478 0-8.268-2.943-9.542-7z">
                    </path>
                </svg>
            </button>
            <!-- NEW: Fullscreen Button -->
            <button id="fullscreen-btn" title="Toggle Fullscreen"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg id="fullscreen-enter-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 1v4m0 0h-4m4 0l-5-5">
                    </path>
                </svg>
                <svg id="fullscreen-exit-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 4H4m0 0v4M4 4l5 5m1-5h4m0 0v4m0-4l-5 5M8 20H4m0 0v-4m0 4l5-5m1 5h4m0 0v-4m0 4l-5-5">
                    </path>
                </svg>
            </button>

            <!-- Set Timer -->
            <button id="set-timer-btn" title="Set Timers"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826 3.31-2.37 2.37.996.608 2.296.07 2.572-1.065z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
            <!-- Play/Pause -->
            <button id="play-pause-btn" title="Play/Pause Timer"
                class="control-btn p-4 bg-white text-black rounded-full shadow-lg transform hover:scale-110 transition-all">
                <svg id="play-icon" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                        clip-rule="evenodd"></path>
                </svg>
                <svg id="pause-icon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h1a1 1 0 001-1V8a1 1 0 00-1-1H8zm5 0a1 1 0 00-1 1v4a1 1 0 001 1h1a1 1 0 001-1V8a1 1 0 00-1-1h-1z"
                        clip-rule="evenodd"></path>
                </svg>
            </button>
            <!-- Reset -->
            <button id="reset-btn" title="Reset Timer"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2.086a8.001 8.001 0 00-11.854-10.49L9.5 6M4 20v-5h.582m15.356-2.086a8.001 8.001 0 01-11.854 10.49L9.5 18">
                    </path>
                </svg>
            </button>

            <!-- <-- REPLACED original Toggle Study/Break button with two buttons:
                 1) switch-mode-btn (still toggles Study/Break)
                 2) timer-type-btn (new: toggles Pomodoro/Stopwatch) -->
            <button id="switch-mode-btn" title="Toggle Study/Break"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all w-20 text-center">
                Study
            </button>

            <button id="timer-type-btn" title="Toggle Pomodoro/Stopwatch"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                Pomodoro
            </button>

            <!-- REMOVED: Move Timer Button -->
            <!-- NEW: Resize Timer Button -->
            <button id="resize-timer-btn" title="Resize Timer"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 7v10M12 7v10M8 7h8M20 7v10M16 7h4"></path>
                </svg>
            </button>

            <button id="journal-btn" title="Journal"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v11.494m-9-11.494v11.494H3v-11.494M12 6.253H3.75m8.25 0H20.25V17.747H12">
                    </path>
                </svg>
            </button>
            <!-- REMOVED Stats History Button -->
            <!-- REMOVED To-Do List Button -->
            <!-- Video Controls Toggle -->
            <button id="video-controls-btn" title="Show Video Controls"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z">
                    </path>
                </svg>
            </button>
            <!-- Select Video -->
            <button id="set-video-btn" title="Select Local Video"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
            </button>
            <!-- Mute -->
            <button id="toggle-mute-btn" title="Mute/Unmute Video"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg id="unmute-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z">
                    </path>
                </svg>
                <svg id="mute-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l4-4m0 4l-4-4">
                    </path>
                </svg>
            </button>
            <!-- NEW: YouTube Video Button -->
            <button id="set-youtube-btn" title="Set YouTube Video"
                class="control-btn p-3 text-white/80 hover:text-white hover:bg-white/20 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v14l11-7z"></path>
                </svg>
            </button>
            <!-- NEW: YouTube Controls -->
            <div id="youtube-controls" style="display:none; align-items:center; gap:10px;">
                <button id="yt-playpause" title="Play/Pause">⏸</button>
                <button id="yt-mute" title="Mute/Unmute">🔇</button>
                <input type="range" id="yt-seekbar" min="0" max="100" value="0" step="1" style="width:100px;">
                <select id="yt-quality">
                    <option value="auto">Auto</option>
                    <option value="hd1080">1080p</option>
                    <option value="hd720">720p</option>
                    <option value="large">480p</option>
                    <option value="medium">360p</option>
                </select>
            </div>


        </div>
    </div>

    <!-- 5. Modals (Hidden by default) -->

    <!-- Set Timer Modal -->
    <div id="timer-modal"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center z-30 hidden">
        <div class="bg-gray-900 text-white p-8 rounded-xl shadow-2xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6 text-center">Set Timers</h2>
            <p class="text-gray-400 mb-2">Study Duration (minutes):</p>
            <input id="study-timer-input" type="number" min="1" value="25"
                class="w-full p-3 bg-gray-800 border border-gray-700 rounded-lg text-white text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <p class="text-gray-400 mb-2 mt-4">Break Duration (minutes):</p>
            <input id="break-timer-input" type="number" min="1" value="5"
                class="w-full p-3 bg-gray-800 border border-gray-700 rounded-lg text-white text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex justify-between space-x-4 mt-6">
                <button id="timer-modal-cancel"
                    class="w-full p-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition-all">Cancel</button>
                <button id="timer-modal-ok"
                    class="w-full p-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold transition-all">Set</button>
            </div>
        </div>
    </div>

    <!-- NEW: Resize Timer Modal -->
    <div id="resize-modal"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center z-30 hidden">
        <div class="bg-gray-900 text-white p-8 rounded-xl shadow-2xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-6 text-center">Resize Timer</h2>
            <p class="text-gray-400 mb-2">Timer Size</p>
            <input id="timer-size-slider" type="range" min="6" max="14" value="10" step="0.5"
                class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
            <div class="flex flex-col space-y-4 mt-6">
                <!-- REMOVED: Reset Position Button -->
                <button id="resize-modal-ok"
                    class="w-full p-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold transition-all">Close</button>
            </div>
        </div>
    </div>

    <div id="journal-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center z-30 hidden">
        <div class="bg-gray-900 text-white p-6 rounded-xl shadow-2xl w-full max-w-3xl h-full max-h-[80vh] flex flex-col">
            <h2 class="text-2xl font-bold mb-4 text-center">Mood Journal</h2>
    
            <div class="flex-grow grid grid-cols-1 md:grid-cols-3 gap-6 overflow-y-auto">
                <div class="md:col-span-1 flex flex-col space-y-4">
                    <div class="bg-gray-800 p-4 rounded-lg">
                        <h3 class="text-lg font-semibold mb-3 text-gray-300">Today's Entry</h3>
                        <p class="text-sm text-gray-400 mb-2">How are you feeling?</p>
                        <div class="flex justify-around mb-3">

                        studyTimeToday++;
                    } else {
                        breakTimeToday++;
                    }

                    // Save stats periodically
                    const now = Date.now();
                    if (now - lastSaveTimestamp > 5000) { // Save every 5 seconds
                        saveStatsToLocalStorage();
                        lastSaveTimestamp = now;
                    }

                    updateTimerDisplay();

                    if (remainingTime <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        playIcon.classList.remove('hidden');
                        pauseIcon.classList.add('hidden');
                        alarmSound.play();

                        // Save final stats for this session

        // NEW: Save stats to localStorage
        function saveStatsToLocalStorage() {
            const newToday = getTodayDateString();

            if (newToday !== todayDateString) {
                // Day has rolled over. Save old day to history.
                const yesterdayString = todayDateString;
                const yesterdayStats = {
                    date: yesterdayString,
                    totalStudy: studyTimeToday,
                    totalBreak: breakTimeToday
                };

                // Add to history if there was activity
                if (yesterdayStats.totalStudy > 0 || yesterdayStats.totalBreak > 0) {
                    statsHistory.push(yesterdayStats);
                    localStorage.setItem('statsHistory', JSON.stringify(statsHistory));
                }

                // Reset counters for new day
                todayDateString = newToday;
                studyTimeToday = 0;
                breakTimeToday = 0;
            }

            // Save current day's stats
            const statsData = {
                [todayDateString]: {
                    totalStudy: studyTimeToday,
                    totalBreak: breakTimeToday
                }
            };
            localStorage.setItem('studyStats', JSON.stringify(statsData));

            function renderJournalEntries() {
                // Sort newest first
                journalEntries.sort((a, b) => new Date(b.date) - new Date(a.date));

                journalEntriesContainer.innerHTML = ''; // Clear existing

                if (journalEntries.length === 0) {
                    // This matches the style of your screenshot
                    journalEntriesContainer.innerHTML = `<p class="text-gray-400 italic text-center mt-8">No entries yet!</p>`;
                    return;
                }

                journalEntries.forEach(entry => {
                    const entryDate = new Date(entry.date);
                    // Use a nice date format
                    const displayDate = entryDate.toLocaleDateString(undefined, {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    const entryEl = document.createElement('div');
                    entryEl.className = 'bg-gray-700 p-4 rounded-lg';
                    entryEl.innerHTML = `
            <div class="flex justify-between items-center mb-2">
                <span class="text-2xl">${entry.mood}</span>
                <span class="text-sm font-medium text-gray-400">${displayDate}</span>
            </div>
            <p class="text-gray-300 whitespace-pre-wrap">${entry.text}</p>
        `;
                    journalEntriesContainer.appendChild(entryEl);
                });
            }

            function saveJournalEntry() {
                const entryText = journalTextArea.value.trim();
                const today = getTodayJournalDateString();

                if (entryText === "") {
                    alert("Please write something in your journal entry.");
                    return;
                }

                // Find if an entry for today already exists
                const existingEntryIndex = journalEntries.findIndex(entry => entry.date === today);

                if (existingEntryIndex > -1) {
                    // Update existing entry
                    journalEntries[existingEntryIndex].text = entryText;
                    journalEntries[existingEntryIndex].mood = selectedMood;
                } else {
                    // Add new entry
                    const newEntry = {
                        date: today,
                        mood: selectedMood,
                        text: entryText
                    };
                    journalEntries.push(newEntry);
                }

                // Save to localStorage
                localStorage.setItem('journalEntries', JSON.stringify(journalEntries));
                // Re-render the list
                renderJournalEntries();
                // Show a saved confirmation
                journalSaveBtn.textContent = 'Saved!';
                setTimeout(() => {
                    journalSaveBtn.textContent = "Save Today's Entry";
                }, 1500);
            }

            // --- Event Listeners for Journal ---

            journalBtn.addEventListener('click', () => {
                // 1. Render all past entries
                renderJournalEntries();

                // 2. Check if there is an entry for today
                const today = getTodayJournalDateString();
                const todayEntry = journalEntries.find(entry => entry.date === today);

                if (todayEntry) {
                    // If so, load it into the editor
                    journalTextArea.value = todayEntry.text;
                    selectedMood = todayEntry.mood;
                } else {
                    // If not, clear the editor
                    journalTextArea.value = '';
                    selectedMood = '😐'; // Reset to default
                }

                // 3. Set the active mood button
                moodButtons.forEach(b => {
                    b.classList.toggle('bg-blue-600', b.dataset.mood === selectedMood);
                });

                // 4. Show the modal
                journalModal.classList.remove('hidden');
            });

            journalModalClose.addEventListener('click', () => journalModal.classList.add('hidden'));
            journalModal.addEventListener('click', (e) => {
                if (e.target === journalModal) journalModal.classList.add('hidden');
            });

            moodButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove selected style from all
                    moodButtons.forEach(b => b.classList.remove('bg-blue-600'));
                    // Add to clicked one
                    btn.classList.add('bg-blue-600');
                    selectedMood = btn.dataset.mood;
                });
            });

            journalSaveBtn.addEventListener('click', saveJournalEntry);

        // NEW: Timer Type toggle (Pomodoro <-> Stopwatch)
        timerTypeBtn.addEventListener('click', () => {
            // Toggle type
            if (timerType === 'pomodoro') {
                timerType = 'stopwatch';
                timerTypeBtn.textContent = 'Stopwatch';
                // start stopwatch from zero
                elapsedSeconds = 0;
            } else {
                timerType = 'pomodoro';
                timerTypeBtn.textContent = 'Pomodoro';
                // ensure remainingTime corresponds to mode
                remainingTime = (currentMode === 'study') ? studyDuration : breakDuration;
            }
            // visual reset but keep stats
            resetTimer();
        });

        // Ensure the switch-mode button label reflects current mode
        function refreshSwitchModeLabel() {
            switchModeBtn.textContent = (currentMode === 'study') ? 'Study' : 'Break';
        }

        // Shortcuts: space toggles play/pause
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) pauseTimer(); else startTimer();
            }
        });

        // --- Init ---
        // REMOVED console logs for API key
        loadDataFromLocalStorage(); // NEW: Load all data

        // Ensure timerType button label matches
        timerTypeBtn.textContent = (timerType === 'pomodoro') ? 'Pomodoro' : 'Stopwatch';
        // Ensure switch-mode label
        refreshSwitchModeLabel();

        // --- NEW: Top-right "time left until the hour" updater ---
        function updateTopHourLeft() {
            try {
                const now = new Date();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                const totalSecondsLeft = (59 - minutes) * 60 + (60 - seconds);
                const minsLeft = Math.floor(totalSecondsLeft / 60);
                const secsLeft = totalSecondsLeft % 60;
                if (topHourLeftTextEl) {
                    topHourLeftTextEl.textContent = `${minsLeft}m ${String(secsLeft).padStart(2, '0')}s left this hour`;
                }
            } catch (e) {
                // silent
            }
        }
        updateTopHourLeft();
        setInterval(updateTopHourLeft, 1000);

        resetTimer(); // MODIFIED: Set initial timer display and mode text
        // REMOVED renderChatHistory();

        // --- NEW: YouTube Integration ---

        let ytPlayer = null;
        const youtubeContainer = document.getElementById('youtube-bg');
        const setYoutubeBtn = document.getElementById('set-youtube-btn');

        // Add YouTube API
        const ytScript = document.createElement('script');
        ytScript.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(ytScript);

        window.onYouTubeIframeAPIReady = () => { };

        setYoutubeBtn.addEventListener('click', () => {
            const url = prompt("Enter YouTube video URL:");
            if (!url) return;

            // --- FIX for GitHub Pages YouTube API origin issues ---
            if (location.hostname.includes('github.io')) {
                const meta = document.createElement('meta');
                meta.httpEquiv = "Content-Security-Policy";
                meta.content = "upgrade-insecure-requests";
                document.head.appendChild(meta);
            }


            const idMatch = url.match(/(?:youtube\.com.*(?:\?|&)v=|youtu\.be\/)([^&#]+)/);
            if (!idMatch) return alert("Invalid YouTube URL");
            const videoId = idMatch[1];

            // hide local video
            videoPlayer.pause();
            videoPlayer.style.display = 'none';

            // show YouTube
            youtubeContainer.style.display = 'block';

            if (ytPlayer) {
                ytPlayer.loadVideoById(videoId);
            } else {
                ytPlayer = new YT.Player('youtube-bg', {
                    videoId: videoId,
                    playerVars: {
                        autoplay: 1,
                        loop: 1,
                        playlist: videoId,
                        controls: 0,
                        modestbranding: 1,
                        mute: 1,
                        origin: window.location.href,
                    },
                    events: {
                        onReady: (e) => {
                            e.target.playVideo();

                            // --- show controls ---
                            document.getElementById('youtube-controls').style.display = 'flex';
                            const playPauseBtn = document.getElementById('yt-playpause');
                            const muteBtn = document.getElementById('yt-mute');
                            const seekBar = document.getElementById('yt-seekbar');
                            const qualitySelect = document.getElementById('yt-quality');

                            // --- Update seek bar every second ---
                            setInterval(() => {
                                if (ytPlayer && ytPlayer.getDuration) {
                                    const progress = (ytPlayer.getCurrentTime() / ytPlayer.getDuration()) * 100;
                                    seekBar.value = progress || 0;
                                }
                            }, 1000);

                            // --- Seek when user moves slider ---
                            seekBar.addEventListener('input', () => {
                                const newTime = (seekBar.value / 100) * ytPlayer.getDuration();
                                ytPlayer.seekTo(newTime, true);
                            });

                            // --- Play/pause toggle ---
                            playPauseBtn.addEventListener('click', () => {
                                const state = ytPlayer.getPlayerState();
                                if (state === YT.PlayerState.PLAYING) {
                                    ytPlayer.pauseVideo();
                                    playPauseBtn.textContent = '▶️';
                                } else {
                                    ytPlayer.playVideo();
                                    playPauseBtn.textContent = '⏸';
                                }
                            });

                            // --- Mute/unmute toggle ---
                            muteBtn.addEventListener('click', () => {
                                if (ytPlayer.isMuted()) {
                                    ytPlayer.unMute();
                                    muteBtn.textContent = '🔊';
                                } else {
                                    ytPlayer.mute();
                                    muteBtn.textContent = '🔇';
                                }
                            });

                            // --- Quality change ---
                            qualitySelect.addEventListener('change', () => {
                                const level = qualitySelect.value;
                                if (level === 'auto') ytPlayer.setPlaybackQualityRange();
                                else ytPlayer.setPlaybackQuality(level);
                            });
                        },

                        onError: (e) => console.error('YouTube Player Error:', e.data)
                    }

                });
            }
        });  // this closes the setYoutubeBtn click listener
    </script>
</body>
