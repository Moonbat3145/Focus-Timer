<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer Zen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fix for fullscreen white line */
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; }

        /* Ensure the video player is a background element */
        #bg-video {
            position: fixed; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%; width: auto; height: auto;
            transform: translateX(-50%) translateY(-50%);
            z-index: -10; pointer-events: none; object-fit: cover;
        }

        /* Background Image Style */
        #bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -5; display: none;
        }

        /* Animation Canvas (Snow/Rain) */
        #effect-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        body { font-family: 'Inter', sans-serif; overflow: hidden; }

        .text-shadow { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); }

        /* Timer Wrapper (Draggable) */
        #timer-wrapper { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); /* Default centered */
            cursor: grab; 
            user-select: none;
            z-index: 10; /* Lowered to sit behind modals/menus */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
            touch-action: none; /* Critical for smooth touch dragging */
        }
        
        /* Ring Mode Specifics */
        #timer-wrapper.ring-mode {
            aspect-ratio: 1 / 1; /* Force Square for Perfect Circle */
            border-radius: 50%;
            padding: 4rem; /* More padding so ring covers text comfortably */
            background-color: rgba(0, 0, 0, 0.2); /* Slight darkening for readability */
            backdrop-filter: blur(2px);
        }
        
        /* Clean Mode Specifics */
        #timer-wrapper.clean-mode {
            padding: 1rem;
            border-radius: 1rem;
        }

        #timer-wrapper:active { cursor: grabbing; }
        #timer-wrapper:hover { background-color: rgba(255,255,255,0.05); }

        /* Timer Adjust Buttons */
        .time-adjust-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 3rem; font-weight: 200; color: rgba(255, 255, 255, 0.4);
            cursor: pointer; padding: 1rem; opacity: 0;
            transition: opacity 0.2s ease-in-out, color 0.2s ease-in-out; user-select: none;
            z-index: 12; /* Slightly above timer wrapper */
        }
        .time-adjust-btn:hover { color: rgba(255, 255, 255, 0.8); }
        #timer-wrapper:hover .time-adjust-btn { opacity: 1; }
        #subtract-time-btn { left: -60px; }
        #add-time-btn { right: -60px; }

        /* Ring Progress Styles */
        #timer-ring-svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            transform: rotate(-90deg);
            display: block; 
            overflow: visible;
        }
        circle { transition: stroke-dashoffset 0.5s ease; }

        /* Common Control Btn */
        .control-btn { transition: all 0.3s ease; }

        /* Video Seek Bar */
        #video-seek-bar {
            -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
            background: rgba(255, 255, 255, 0.3); border-radius: 3px; outline: none;
            cursor: pointer; transition: height 0.2s ease;
        }
        #video-seek-bar:hover { height: 10px; }
        #video-seek-bar::-webkit-progress-bar { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }
        #video-seek-bar::-webkit-progress-value { background: white; border-radius: 3px; }
        #video-seek-bar::-moz-progress-bar { background: white; border-radius: 3px; }

        /* Resizable Timer */
        #timer-display { 
            font-size: var(--timer-font-size, 8rem); 
            line-height: 0.9; 
            pointer-events: none; 
            white-space: nowrap;
        }

        /* UI Hide */
        .ui-hide { opacity: 0 !important; pointer-events: none !important; transition: opacity 0.3s ease-out; }

        /* Pop-up Menus */
        .popup-menu {
            position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
            background-color: rgba(20, 20, 20, 0.95); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); padding: 1rem;
            border-radius: 1rem; width: 320px; z-index: 50;
            display: none; flex-direction: column; gap: 0.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .popup-menu.active { display: flex; }

        /* Music Queue Item */
        .queue-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.5rem; border-radius: 0.5rem; background: rgba(255,255,255,0.05);
            font-size: 0.85rem; transition: background 0.2s;
            group: ;
        }
        .queue-item:hover { background: rgba(255,255,255,0.1); }
        .queue-item.active-track { background: rgba(59, 130, 246, 0.3); border: 1px solid rgba(59, 130, 246, 0.5); }
        
        .queue-controls {
            display: flex; gap: 0.25rem; opacity: 0.5; transition: opacity 0.2s;
        }
        .queue-item:hover .queue-controls { opacity: 1; }
        .queue-btn { padding: 2px; cursor: pointer; }
        .queue-btn:hover { color: white; }

        /* Volume Slider */
        input[type=range].volume-slider {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range].volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: white; cursor: pointer; margin-top: -4px;
        }
        input[type=range].volume-slider::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.3); border-radius: 2px;
        }
    </style>
</head>

    <script type="module">
        // --- App State & Config ---
        let timerInterval = null, studyDuration = 25 * 60, breakDuration = 5 * 60;
        let remainingTime = studyDuration, isRunning = false, currentMode = 'study';
        let timerType = 'pomodoro', elapsedSeconds = 0, pomodoroEndTime = 0;
        let lastTickTime = 0, visualMode = 'ring';
        let studyTimeToday = 0, breakTimeToday = 0, todayDateString = getTodayDateString(), lastSaveTimestamp = 0;
        let questionCountToday = 0;

        // --- BACKGROUND MEDIA STATE ---
        let activeBgPlayer = 'local', bgVideoIdToLoad = null, ytBgPlayer = null, ytBgSeekBarInterval = null;
        let isBgMuted = true;
        let bgPlaylist = []; 

        // --- MUSIC PLAYER STATE ---
        let musicPlaylist = [], currentMusicIndex = -1;
        let isMusicPlaying = false, isMusicMuted = false, musicVolume = 100;
        let ytMusicPlayer = null, musicVideoIdToLoad = null; 
        let musicPlaybackMode = 'off'; // 'off', 'loop_all', 'loop_one'

        // --- UI Elements ---
        const timerDisplay = document.getElementById('timer-display');
        const timerWrapper = document.getElementById('timer-wrapper');
        const timerRingSvg = document.getElementById('timer-ring-svg');
        const timerRingProgress = document.getElementById('timer-ring-progress');
        const toggleVisualModeBtn = document.getElementById('toggle-visual-mode-btn');

        const playBtn = document.getElementById('play-pause-btn'), playIcon = document.getElementById('play-icon'), pauseIcon = document.getElementById('pause-icon');
        const resetBtn = document.getElementById('reset-btn'), alarmSound = document.getElementById('alarm-sound');
        const switchModeBtn = document.getElementById('switch-mode-btn'), timerTypeBtn = document.getElementById('timer-type-btn');
        const controlsBar = document.getElementById('controls-bar'), minimizeBtn = document.getElementById('minimize-btn');
        const addTimeBtn = document.getElementById('add-time-btn'), subtractTimeBtn = document.getElementById('subtract-time-btn');
        
        const toggleQuestionCounterBtn = document.getElementById('toggle-question-counter-btn');
        const questionCounterDisplay = document.getElementById('question-counter-display');
        const questionCountEl = document.getElementById('question-count-el');
        const questionAddBtn = document.getElementById('question-add-btn'), questionSubtractBtn = document.getElementById('question-subtract-btn');

        // --- BACKGROUND UI ---
        const bgVideoPlayer = document.getElementById('bg-video'), videoFileInput = document.getElementById('video-file-input');
        const setVideoBtn = document.getElementById('set-video-btn'), setYoutubeBtn = document.getElementById('set-youtube-btn');
        const youtubeBgContainer = document.getElementById('youtube-bg'), bgCurrentTitleEl = document.getElementById('bg-current-title');
        const bgPlaylistList = document.getElementById('bg-playlist-list');
        
        const videoControlsContainer = document.getElementById('video-controls-container'), videoControlsToggle = document.getElementById('video-controls-toggle');
        const videoTimeDisplay = document.getElementById('video-time-display'), videoSeekBar = document.getElementById('video-seek-bar');
        const videoPlayPauseBtn = document.getElementById('video-play-pause-btn'), videoPlayIcon = document.getElementById('video-play-icon'), videoPauseIcon = document.getElementById('video-pause-icon');
        const bgMuteBtn = document.getElementById('bg-mute-btn'), bgMuteIcon = document.getElementById('bg-mute-icon'), bgUnmuteIcon = document.getElementById('bg-unmute-icon');
        const bgQualitySelect = document.getElementById('bg-quality-select');

        // --- IMAGE & FX UI ---
        const imageFileInput = document.getElementById('image-file-input'), bgImageEl = document.getElementById('bg-image');
        const setImageBtn = document.getElementById('set-image-btn'), toggleSnowBtn = document.getElementById('toggle-snow-btn'), toggleRainBtn = document.getElementById('toggle-rain-btn');

        // --- MENU UI ---
        const bgMenuBtn = document.getElementById('bg-menu-btn'), bgMenuContainer = document.getElementById('bg-menu-container');
        const musicMenuBtn = document.getElementById('music-menu-btn'), musicMenuContainer = document.getElementById('music-menu-container');

        // --- MUSIC UI ---
        const musicPlayBtn = document.getElementById('music-play-btn'), musicPlayIcon = document.getElementById('music-play-icon'), musicPauseIcon = document.getElementById('music-pause-icon');
        const musicNextBtn = document.getElementById('music-next-btn'), musicPrevBtn = document.getElementById('music-prev-btn');
        const musicMuteBtn = document.getElementById('music-mute-btn'), musicUnmuteIcon = document.getElementById('music-unmute-icon'), musicMuteIcon = document.getElementById('music-mute-icon');
        const musicLoopModeBtn = document.getElementById('music-loop-mode-btn');
        const addMusicYtBtn = document.getElementById('add-music-yt-btn'), addMusicLocalBtn = document.getElementById('add-music-local-btn'), musicFileInput = document.getElementById('music-file-input');
        const musicQueueList = document.getElementById('music-queue-list'), localMusicPlayer = document.getElementById('local-music-player');
        const musicCurrentDisplay = document.getElementById('music-current-display'), musicCurrentTitleEl = document.getElementById('music-current-title'), musicVolumeSlider = document.getElementById('music-volume-slider');

        // --- DRAG LOGIC ---
        let isDragging = false, dragOffsetX = 0, dragOffsetY = 0;
        timerWrapper.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
            isDragging = true;
            const rect = timerWrapper.getBoundingClientRect();
            dragOffsetX = e.clientX - (rect.left + rect.width / 2);
            dragOffsetY = e.clientY - (rect.top + rect.height / 2);
            timerWrapper.style.cursor = 'grabbing';
            timerWrapper.style.transform = 'translate(-50%, -50%)'; 
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return; e.preventDefault();
            timerWrapper.style.left = `${e.clientX - dragOffsetX}px`; timerWrapper.style.top = `${e.clientY - dragOffsetY}px`;
        });
        document.addEventListener('mouseup', () => { isDragging = false; timerWrapper.style.cursor = 'grab'; });

        // Touch Dragging
        timerWrapper.addEventListener('touchstart', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
            isDragging = true;
            const touch = e.touches[0];
            const rect = timerWrapper.getBoundingClientRect();
            dragOffsetX = touch.clientX - (rect.left + rect.width / 2);
            dragOffsetY = touch.clientY - (rect.top + rect.height / 2);
            timerWrapper.style.cursor = 'grabbing';
            timerWrapper.style.transform = 'translate(-50%, -50%)'; 
        }, {passive: false});
        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return; e.preventDefault();
            const touch = e.touches[0];
            timerWrapper.style.left = `${touch.clientX - dragOffsetX}px`; timerWrapper.style.top = `${touch.clientY - dragOffsetY}px`;
        }, {passive: false});
        document.addEventListener('touchend', () => { isDragging = false; timerWrapper.style.cursor = 'grab'; });

        // --- MENU TOGGLE LOGIC ---
        bgMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); bgMenuContainer.classList.toggle('active'); musicMenuContainer.classList.remove('active'); });
        musicMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); musicMenuContainer.classList.toggle('active'); bgMenuContainer.classList.remove('active'); });
        document.addEventListener('click', (e) => {
            if (!bgMenuContainer.contains(e.target) && e.target !== bgMenuBtn) bgMenuContainer.classList.remove('active');
            if (!musicMenuContainer.contains(e.target) && e.target !== musicMenuBtn) musicMenuContainer.classList.remove('active');
        });

        // ==========================================
        //  BACKGROUND VIDEO LOGIC
        // ==========================================

        setVideoBtn.addEventListener('click', () => videoFileInput.click());
        videoControlsToggle.addEventListener('click', () => { videoControlsContainer.classList.toggle('hidden'); });

        function addToBgPlaylist(item) { bgPlaylist.push(item); renderBgPlaylist(); }

        function renderBgPlaylist() {
            bgPlaylistList.innerHTML = '';
            if (bgPlaylist.length === 0) { bgPlaylistList.innerHTML = '<div class="text-xs text-white/30 italic">No saved backgrounds</div>'; return; }
            bgPlaylist.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-1 hover:bg-white/10 rounded cursor-pointer group";
                div.innerHTML = `<span class="truncate text-xs text-white/80 w-40">${item.name}</span>`;
                div.onclick = () => loadBackgroundFromPlaylist(index);
                bgPlaylistList.appendChild(div);
            });
        }

        function loadBackgroundFromPlaylist(index) {
            const item = bgPlaylist[index];
            if (item.type === 'youtube') loadYouTubeBg(item.src);
            else if (item.type === 'local') loadLocalBg(item.src, item.name);
            else if (item.type === 'image') loadLocalImage(item.src, item.name);
        }

        function loadLocalBg(url, name) {
            bgVideoPlayer.src = url; bgVideoPlayer.play();
            bgVideoPlayer.muted = true; isBgMuted = true; updateBgMuteUI();
            
            activeBgPlayer = 'local';
            bgVideoPlayer.style.display = 'block'; bgImageEl.style.display = 'none'; youtubeBgContainer.style.display = 'none';
            if (ytBgPlayer && ytBgPlayer.pauseVideo) ytBgPlayer.pauseVideo();
            
            videoControlsContainer.classList.remove('hidden'); bgQualitySelect.classList.add('hidden');
            rewireControlsForLocalBg(); bgCurrentTitleEl.textContent = name;
        }

        function loadLocalImage(url, name) {
            bgImageEl.src = url; bgImageEl.style.display = 'block';
            bgVideoPlayer.style.display = 'none'; youtubeBgContainer.style.display = 'none';
            if (ytBgPlayer) ytBgPlayer.pauseVideo(); bgVideoPlayer.pause();
            videoControlsContainer.classList.add('hidden'); bgCurrentTitleEl.textContent = name;
        }

        function loadYouTubeBg(videoId) {
            bgVideoPlayer.pause(); bgVideoPlayer.style.display = 'none'; bgImageEl.style.display = 'none';
            youtubeBgContainer.style.display = 'block'; videoControlsContainer.classList.remove('hidden');
            bgQualitySelect.classList.remove('hidden');

            if (ytBgPlayer) {
                activeBgPlayer = 'youtube'; ytBgPlayer.loadVideoById(videoId); rewireControlsForYouTubeBg();
            } else {
                 if (window.YT && window.YT.Player) createYouTubeBgPlayer(videoId);
                 else bgVideoIdToLoad = videoId;
            }
            bgCurrentTitleEl.textContent = `Loading...`;
        }

        videoFileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                if (bgVideoPlayer.src) URL.revokeObjectURL(bgVideoPlayer.src);
                const videoURL = URL.createObjectURL(file);
                loadLocalBg(videoURL, file.name); addToBgPlaylist({ type: 'local', src: videoURL, name: file.name });
            }
        });

        // Parse Multiple YT URLs
        setYoutubeBtn.addEventListener('click', () => {
             const input = prompt("Enter YouTube video URL(s). Paste multiple URLs separated by commas or spaces for a playlist effect:");
            if (!input) return;
            const regex = /(?:v=|youtu\.be\/)([^&?\s,]+)/g;
            let match, firstId = null, addedCount = 0;
            while ((match = regex.exec(input)) !== null) {
                if(!firstId) firstId = match[1];
                addToBgPlaylist({ type: 'youtube', src: match[1], name: `Loading Title...` });
                addedCount++;
            }
            if(addedCount === 0) return alert("Invalid YouTube URL");
            loadYouTubeBg(firstId);
        });

        setImageBtn.addEventListener('click', () => imageFileInput.click());
        imageFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const imgUrl = URL.createObjectURL(file);
                loadLocalImage(imgUrl, file.name); addToBgPlaylist({ type: 'image', src: imgUrl, name: file.name });
            }
        });

        function formatVideoTime(timeInSeconds) {
            if (isNaN(timeInSeconds)) return "00:00";
            const totalSeconds = Math.floor(timeInSeconds), minutes = Math.floor(totalSeconds / 60), seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // --- Local BG Controls ---
        function localBgTimeUpdate() {
            if (isNaN(bgVideoPlayer.duration)) return;
            videoSeekBar.value = bgVideoPlayer.currentTime; videoSeekBar.max = bgVideoPlayer.duration;
            videoTimeDisplay.textContent = `${formatVideoTime(bgVideoPlayer.currentTime)} / ${formatVideoTime(bgVideoPlayer.duration)}`;
        }
        function localBgSeekClick(e) {
            const rect = videoSeekBar.getBoundingClientRect(), percentage = (e.clientX - rect.left) / rect.width;
            bgVideoPlayer.currentTime = percentage * bgVideoPlayer.duration;
        }
        function localBgPlayPause() { if (bgVideoPlayer.paused) bgVideoPlayer.play(); else bgVideoPlayer.pause(); }
        function onLocalBgPlay() { videoPlayIcon.classList.add('hidden'); videoPauseIcon.classList.remove('hidden'); }
        function onLocalBgPause() { videoPlayIcon.classList.remove('hidden'); videoPauseIcon.classList.add('hidden'); }

        function rewireControlsForLocalBg() {
            if (ytBgSeekBarInterval) clearInterval(ytBgSeekBarInterval);
            videoSeekBar.removeEventListener('click', youtubeBgSeekClick); videoPlayPauseBtn.removeEventListener('click', youtubeBgPlayPause);
            bgVideoPlayer.addEventListener('timeupdate', localBgTimeUpdate); videoSeekBar.addEventListener('click', localBgSeekClick);
            videoPlayPauseBtn.addEventListener('click', localBgPlayPause); bgVideoPlayer.addEventListener('play', onLocalBgPlay);
            bgVideoPlayer.addEventListener('pause', onLocalBgPause);
            if (bgVideoPlayer.paused) onLocalBgPause(); else onLocalBgPlay();
            localBgTimeUpdate();
        }

        // --- YouTube BG Controls ---
        function youtubeBgSeekUpdate() {
            if (ytBgPlayer && ytBgPlayer.getDuration) {
                const duration = ytBgPlayer.getDuration(), currentTime = ytBgPlayer.getCurrentTime();
                videoSeekBar.max = duration; videoSeekBar.value = currentTime;
                videoTimeDisplay.textContent = `${formatVideoTime(currentTime)} / ${formatVideoTime(duration)}`;
            }
        }
        function youtubeBgSeekClick(e) {
            const rect = videoSeekBar.getBoundingClientRect(), percentage = (e.clientX - rect.left) / rect.width;
            ytBgPlayer.seekTo(percentage * ytBgPlayer.getDuration(), true);
        }
        function youtubeBgPlayPause() {
            if (!ytBgPlayer || typeof ytBgPlayer.getPlayerState !== 'function') return;
            const state = ytBgPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) ytBgPlayer.pauseVideo(); else ytBgPlayer.playVideo();
        }
        function youtubeBgStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                videoPlayIcon.classList.add('hidden'); videoPauseIcon.classList.remove('hidden');
                // Fetch Original Title
                let data = ytBgPlayer.getVideoData();
                if(data && data.title) {
                    bgCurrentTitleEl.textContent = data.title;
                    let currentItem = bgPlaylist.find(i => i.src === data.video_id);
                    if(currentItem) { currentItem.name = data.title; renderBgPlaylist(); }
                }
            } else {
                videoPlayIcon.classList.remove('hidden'); videoPauseIcon.classList.add('hidden');
            }
        }

        function rewireControlsForYouTubeBg() {
            if (ytBgSeekBarInterval) clearInterval(ytBgSeekBarInterval);
            bgVideoPlayer.removeEventListener('timeupdate', localBgTimeUpdate); videoSeekBar.removeEventListener('click', localBgSeekClick);
            videoPlayPauseBtn.removeEventListener('click', localBgPlayPause); bgVideoPlayer.removeEventListener('play', onLocalBgPlay); bgVideoPlayer.removeEventListener('pause', onLocalBgPause);
            videoSeekBar.addEventListener('click', youtubeBgSeekClick); videoPlayPauseBtn.addEventListener('click', youtubeBgPlayPause);
            ytBgSeekBarInterval = setInterval(youtubeBgSeekUpdate, 500);
            if (ytBgPlayer && typeof ytBgPlayer.getPlayerState === 'function') youtubeBgStateChange({ data: ytBgPlayer.getPlayerState() });
        }

        // BG Quality Selector
        bgQualitySelect.addEventListener('change', (e) => {
             if (ytBgPlayer && typeof ytBgPlayer.setPlaybackQuality === 'function') {
                 ytBgPlayer.setPlaybackQuality(e.target.value);
             }
        });

        // --- BG Mute Toggle ---
        function updateBgMuteUI() {
             if (isBgMuted) { bgUnmuteIcon.classList.remove('hidden'); bgMuteIcon.classList.add('hidden'); } 
             else { bgUnmuteIcon.classList.add('hidden'); bgMuteIcon.classList.remove('hidden'); }
        }
        bgMuteBtn.addEventListener('click', () => {
            if (activeBgPlayer === 'local') { bgVideoPlayer.muted = !bgVideoPlayer.muted; isBgMuted = bgVideoPlayer.muted; } 
            else if (activeBgPlayer === 'youtube' && ytBgPlayer) {
                if (ytBgPlayer.isMuted()) { ytBgPlayer.unMute(); isBgMuted = false; } else { ytBgPlayer.mute(); isBgMuted = true; }
            }
            updateBgMuteUI();
        });


        // ==========================================
        //  MUSIC PLAYER LOGIC
        // ==========================================
        
        function renderMusicQueue() {
            musicQueueList.innerHTML = '';
            if(musicPlaylist.length === 0) {
                 musicQueueList.innerHTML = '<div class="text-xs text-gray-500 text-center italic py-2">Queue is empty</div>'; return;
            }
            musicPlaylist.forEach((track, index) => {
                const el = document.createElement('div');
                el.className = `queue-item ${index === currentMusicIndex ? 'active-track' : ''}`;
                el.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden flex-1 cursor-pointer" onclick="window.playMusicTrack(${index})">
                        <span class="text-xs opacity-50">${index + 1}.</span>
                        <div class="truncate text-sm w-full">${track.name}</div>
                    </div>
                    <div class="queue-controls flex items-center ml-2">
                        <button class="queue-btn hover:text-blue-300" onclick="event.stopPropagation(); window.moveTrackUp(${index})" title="Move Up">↑</button>
                        <button class="queue-btn hover:text-blue-300" onclick="event.stopPropagation(); window.moveTrackDown(${index})" title="Move Down">↓</button>
                        <button class="queue-btn text-red-400 hover:text-red-300 ml-1" onclick="event.stopPropagation(); window.removeTrack(${index})" title="Remove">✕</button>
                    </div>
                `;
                musicQueueList.appendChild(el);
            });
        }

        window.playMusicTrack = function(index) {
            if (index < 0 || index >= musicPlaylist.length) return;
            currentMusicIndex = index; isMusicPlaying = true;
            updateMusicPlayPauseUI(); renderMusicQueue();
            
            musicCurrentDisplay.classList.remove('hidden');
            const track = musicPlaylist[index];
            musicCurrentTitleEl.textContent = track.name;

            if (track.type === 'local') {
                if (ytMusicPlayer && ytMusicPlayer.pauseVideo) ytMusicPlayer.pauseVideo();
                localMusicPlayer.src = track.src; localMusicPlayer.volume = musicVolume / 100; localMusicPlayer.muted = isMusicMuted;
                const playPromise = localMusicPlayer.play();
                if (playPromise !== undefined) playPromise.catch(error => console.error("Playback failed:", error));
            } else {
                localMusicPlayer.pause();
                if (ytMusicPlayer) {
                    ytMusicPlayer.loadVideoById(track.src); ytMusicPlayer.setVolume(musicVolume);
                    if(isMusicMuted) ytMusicPlayer.mute(); else ytMusicPlayer.unMute();
                } else {
                     if (window.YT && window.YT.Player) createYouTubeMusicPlayer(track.src); else musicVideoIdToLoad = track.src;
                }
            }
        };

        window.removeTrack = function(index) {
            musicPlaylist.splice(index, 1);
            if (currentMusicIndex === index) {
                if (musicPlaylist.length > 0) window.playMusicTrack(index < musicPlaylist.length ? index : index - 1);
                else {
                    isMusicPlaying = false; localMusicPlayer.pause(); if(ytMusicPlayer) ytMusicPlayer.pauseVideo();
                    updateMusicPlayPauseUI(); currentMusicIndex = -1; musicCurrentDisplay.classList.add('hidden');
                }
            } else if (index < currentMusicIndex) currentMusicIndex--;
            renderMusicQueue();
        };
        window.moveTrackUp = function(index) {
            if (index <= 0) return;
            const temp = musicPlaylist[index]; musicPlaylist[index] = musicPlaylist[index - 1]; musicPlaylist[index - 1] = temp;
            if (currentMusicIndex === index) currentMusicIndex--; else if (currentMusicIndex === index - 1) currentMusicIndex++;
            renderMusicQueue();
        };
        window.moveTrackDown = function(index) {
            if (index >= musicPlaylist.length - 1) return;
            const temp = musicPlaylist[index]; musicPlaylist[index] = musicPlaylist[index + 1]; musicPlaylist[index + 1] = temp;
            if (currentMusicIndex === index) currentMusicIndex++; else if (currentMusicIndex === index + 1) currentMusicIndex--;
            renderMusicQueue();
        };

        function updateMusicPlayPauseUI() {
            if(isMusicPlaying) { musicPlayIcon.classList.add('hidden'); musicPauseIcon.classList.remove('hidden'); } 
            else { musicPlayIcon.classList.remove('hidden'); musicPauseIcon.classList.add('hidden'); }
        }

        musicPlayBtn.addEventListener('click', () => {
            if(musicPlaylist.length === 0) return;
            if(isMusicPlaying) {
                isMusicPlaying = false; localMusicPlayer.pause(); if(ytMusicPlayer && ytMusicPlayer.pauseVideo) ytMusicPlayer.pauseVideo();
            } else {
                if (currentMusicIndex === -1) window.playMusicTrack(0);
                else {
                    isMusicPlaying = true;
                    if(musicPlaylist[currentMusicIndex].type === 'local') localMusicPlayer.play(); else if (ytMusicPlayer) ytMusicPlayer.playVideo();
                }
            }
            updateMusicPlayPauseUI();
        });

        musicNextBtn.addEventListener('click', () => { if(currentMusicIndex < musicPlaylist.length - 1) window.playMusicTrack(currentMusicIndex + 1); });
        musicPrevBtn.addEventListener('click', () => { if(currentMusicIndex > 0) window.playMusicTrack(currentMusicIndex - 1); });

        musicMuteBtn.addEventListener('click', () => {
            isMusicMuted = !isMusicMuted; localMusicPlayer.muted = isMusicMuted;
            if(ytMusicPlayer) { if(isMusicMuted) ytMusicPlayer.mute(); else ytMusicPlayer.unMute(); }
            if(isMusicMuted) { musicMuteIcon.classList.remove('hidden'); musicUnmuteIcon.classList.add('hidden'); } 
            else { musicMuteIcon.classList.add('hidden'); musicUnmuteIcon.classList.remove('hidden'); }
        });

        musicVolumeSlider.addEventListener('input', (e) => {
            musicVolume = e.target.value; localMusicPlayer.volume = musicVolume / 100;
            if (ytMusicPlayer && ytMusicPlayer.setVolume) ytMusicPlayer.setVolume(musicVolume);
        });

        // Loop Mode Controls
        musicLoopModeBtn.addEventListener('click', () => {
            if (musicPlaybackMode === 'off') { musicPlaybackMode = 'loop_all'; musicLoopModeBtn.textContent = 'Mode: Loop All'; musicLoopModeBtn.classList.add('bg-blue-600'); }
            else if (musicPlaybackMode === 'loop_all') { musicPlaybackMode = 'loop_one'; musicLoopModeBtn.textContent = 'Mode: Loop One'; musicLoopModeBtn.classList.remove('bg-blue-600'); musicLoopModeBtn.classList.add('bg-purple-600'); }
            else { musicPlaybackMode = 'off'; musicLoopModeBtn.textContent = 'Mode: Off'; musicLoopModeBtn.classList.remove('bg-purple-600'); }
        });

        addMusicYtBtn.addEventListener('click', () => {
             const input = prompt("Enter YouTube URL(s). Paste multiple URLs separated by commas or spaces to load a playlist:");
            if (!input) return;
            const regex = /(?:v=|youtu\.be\/)([^&?\s,]+)/g;
            let match, addedCount = 0;
            while ((match = regex.exec(input)) !== null) {
                musicPlaylist.push({ type: 'youtube', src: match[1], name: `Loading Title...` });
                addedCount++;
            }
            if(addedCount === 0) return alert("No valid YouTube IDs found.");
            renderMusicQueue();
            if(musicPlaylist.length === addedCount) window.playMusicTrack(0); // auto-play if it was empty
        });

        addMusicLocalBtn.addEventListener('click', () => musicFileInput.click());
        musicFileInput.addEventListener('change', (e) => {
             const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                musicPlaylist.push({ type: 'local', src: url, name: file.name });
                renderMusicQueue();
                if(musicPlaylist.length === 1) window.playMusicTrack(0);
            }
        });

        function handleMusicEnded() {
             if (musicPlaybackMode === 'loop_one') {
                window.playMusicTrack(currentMusicIndex);
            } else if (musicPlaybackMode === 'loop_all') {
                window.playMusicTrack((currentMusicIndex + 1) % musicPlaylist.length);
            } else {
                if (currentMusicIndex < musicPlaylist.length - 1) {
                     window.playMusicTrack(currentMusicIndex + 1);
                } else {
                     isMusicPlaying = false; updateMusicPlayPauseUI();
                }
            }
        }
        localMusicPlayer.addEventListener('ended', handleMusicEnded);


        // ==========================================
        //  YOUTUBE API SETUP
        // ==========================================
        const ytScript = document.createElement('script');
        ytScript.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(ytScript);

        window.onYouTubeIframeAPIReady = () => {
            if (bgVideoIdToLoad) { createYouTubeBgPlayer(bgVideoIdToLoad); bgVideoIdToLoad = null; }
            if (musicVideoIdToLoad) { createYouTubeMusicPlayer(musicVideoIdToLoad); musicVideoIdToLoad = null; }
        };

        function createYouTubeBgPlayer(videoId) {
            ytBgPlayer = new YT.Player('youtube-bg', {
                videoId: videoId,
                playerVars: { autoplay: 1, loop: 1, playlist: videoId, controls: 0, modestbranding: 1, mute: 1, origin: window.location.href },
                events: {
                    onReady: (e) => {
                        activeBgPlayer = 'youtube'; e.target.playVideo(); rewireControlsForYouTubeBg();
                        isBgMuted = true; updateBgMuteUI();
                    },
                    onStateChange: (e) => youtubeBgStateChange(e)
                }
            });
        }

        function createYouTubeMusicPlayer(videoId) {
            ytMusicPlayer = new YT.Player('music-youtube-player', {
                height: '1', width: '1', 
                videoId: videoId,
                playerVars: { autoplay: 1, controls: 0, modestbranding: 1, origin: window.location.href },
                events: {
                    onReady: (e) => {
                        e.target.playVideo(); e.target.setVolume(musicVolume);
                        if(isMusicMuted) e.target.mute(); else e.target.unMute();
                    },
                    onStateChange: (e) => {
                         if (e.data === YT.PlayerState.PLAYING) {
                             let data = e.target.getVideoData();
                             if(data && data.title) {
                                 musicCurrentTitleEl.textContent = data.title;
                                 if(musicPlaylist[currentMusicIndex]) { musicPlaylist[currentMusicIndex].name = data.title; renderMusicQueue(); }
                             }
                         }
                        if (e.data === YT.PlayerState.ENDED) handleMusicEnded();
                    }
                }
            });
        }


        // ==========================================
        //  CORE TIMER & APP LOGIC
        // ==========================================

        function getTodayDateString(date = new Date()) {
            const now = new Date(date.getTime());
            if (now.getHours() < 5) now.setDate(now.getDate() - 1);
            return now.toISOString().split('T')[0];
        }

        function loadDataFromLocalStorage() {
            const savedStatsJSON = localStorage.getItem('studyStats');
            todayDateString = getTodayDateString();
            if (savedStatsJSON) {
                try {
                    const savedStats = JSON.parse(savedStatsJSON);
                    if (savedStats[todayDateString]) { studyTimeToday = savedStats[todayDateString].totalStudy || 0; breakTimeToday = savedStats[todayDateString].totalBreak || 0; }
                } catch (e) {}
            }
            const savedTimerSize = localStorage.getItem('timerSize');
            if (savedTimerSize) { document.documentElement.style.setProperty('--timer-font-size', `${savedTimerSize}rem`); document.getElementById('timer-size-slider').value = savedTimerSize; }
            
            const savedQuestionCountJSON = localStorage.getItem('questionCount');
            if (savedQuestionCountJSON) {
                try {
                    const savedQuestionCount = JSON.parse(savedQuestionCountJSON);
                    if (savedQuestionCount[todayDateString]) questionCountToday = savedQuestionCount[todayDateString] || 0;
                } catch (e) {}
            }
            questionCountEl.textContent = questionCountToday;
        }

        function saveAllDataToLocalStorage() {
            const newToday = getTodayDateString();
            if (newToday !== todayDateString) { todayDateString = newToday; studyTimeToday = 0; breakTimeToday = 0; questionCountToday = 0; }
            localStorage.setItem('studyStats', JSON.stringify({ [todayDateString]: { totalStudy: Math.round(studyTimeToday), totalBreak: Math.round(breakTimeToday) } }));
            localStorage.setItem('questionCount', JSON.stringify({ [todayDateString]: questionCountToday }));
            questionCountEl.textContent = questionCountToday;
        }

        function updateVisualMode() {
            if (visualMode === 'ring') { timerRingSvg.style.display = 'block'; timerWrapper.classList.add('ring-mode'); timerWrapper.classList.remove('clean-mode'); } 
            else { timerRingSvg.style.display = 'none'; timerWrapper.classList.remove('ring-mode'); timerWrapper.classList.add('clean-mode'); }
        }
        toggleVisualModeBtn.addEventListener('click', () => { visualMode = (visualMode === 'ring') ? 'clean' : 'ring'; updateVisualMode(); updateTimerDisplay(); });

        function updateTimerDisplay() {
            let progress = 0;
            if (timerType === 'pomodoro') {
                const duration = (currentMode === 'study') ? studyDuration : breakDuration;
                const displayTime = Math.round(remainingTime);
                timerDisplay.textContent = `${String(Math.floor(displayTime / 60)).padStart(2, '0')}:${String(displayTime % 60).padStart(2, '0')}`;
                progress = (displayTime / duration) * 100;
            } else {
                const displayTime = Math.round(elapsedSeconds), hs = Math.floor(displayTime / 3600), ms = Math.floor((displayTime % 3600) / 60), ss = displayTime % 60;
                timerDisplay.textContent = `${hs > 0 ? String(hs).padStart(2, '0')+':' : ''}${String(ms).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
                progress = 0; 
            }
            if (visualMode === 'ring') timerRingProgress.style.strokeDashoffset = 283 - (progress / 100) * 283;
        }

        function startTimer() {
            if (isRunning) return; isRunning = true;
            playIcon.classList.add('hidden'); pauseIcon.classList.remove('hidden'); lastTickTime = Date.now();
            if (timerType === 'pomodoro') {
                pomodoroEndTime = Date.now() + (remainingTime * 1000);
                timerInterval = setInterval(() => {
                    const now = Date.now(); const deltaSeconds = (now - lastTickTime) / 1000.0; lastTickTime = now;
                    if (currentMode === 'study') studyTimeToday += deltaSeconds; else breakTimeToday += deltaSeconds;
                    remainingTime = Math.max((pomodoroEndTime - now) / 1000.0, 0);
                    updateTimerDisplay();
                    if (now - lastSaveTimestamp > 5000) { saveAllDataToLocalStorage(); lastSaveTimestamp = now; }
                    if (remainingTime <= 0) {
                        clearInterval(timerInterval); isRunning = false; alarmSound.play();
                        studyTimeToday = Math.round(studyTimeToday); breakTimeToday = Math.round(breakTimeToday);
                        saveAllDataToLocalStorage(); toggleMode(); setTimeout(startTimer, 1000);
                    }
                }, 1000);
            } else {
                timerInterval = setInterval(() => {
                    const now = Date.now(); const deltaSeconds = (now - lastTickTime) / 1000.0; lastTickTime = now;
                    elapsedSeconds += deltaSeconds;
                    if (currentMode === 'study') studyTimeToday += deltaSeconds; else breakTimeToday += deltaSeconds;
                    if (now - lastSaveTimestamp > 5000) { saveAllDataToLocalStorage(); lastSaveTimestamp = now; }
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            if (!isRunning) return; isRunning = false;
            playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden'); clearInterval(timerInterval);
            const now = Date.now(), deltaSeconds = (now - lastTickTime) / 1000.0;
             if (timerType === 'pomodoro') {
                if (currentMode === 'study') studyTimeToday += deltaSeconds; else breakTimeToday += deltaSeconds;
                remainingTime = Math.max((pomodoroEndTime - now) / 1000.0, 0);
            } else {
                elapsedSeconds += deltaSeconds;
                 if (currentMode === 'study') studyTimeToday += deltaSeconds; else breakTimeToday += deltaSeconds;
            }
            saveAllDataToLocalStorage(); updateTimerDisplay();
        }

        function resetTimer() {
            pauseTimer();
            if (timerType === 'pomodoro') remainingTime = (currentMode === 'study') ? studyDuration : breakDuration; else elapsedSeconds = 0;
            updateTimerDisplay();
        }

        function toggleMode() {
            pauseTimer();
            if (currentMode === 'study') { currentMode = 'break'; remainingTime = breakDuration; switchModeBtn.textContent = 'Break'; } 
            else { currentMode = 'study'; remainingTime = studyDuration; switchModeBtn.textContent = 'Study'; }
            resetTimer();
        }

        switchModeBtn.addEventListener('click', toggleMode);
        playBtn.addEventListener('click', () => isRunning ? pauseTimer() : startTimer());
        resetBtn.addEventListener('click', resetTimer);

        // Timer Modals
        const timerModal = document.getElementById('timer-modal'), setTimerBtn = document.getElementById('set-timer-btn');
        const studyTimerInput = document.getElementById('study-timer-input'), breakTimerInput = document.getElementById('break-timer-input');
        const timerModalOk = document.getElementById('timer-modal-ok'), timerModalCancel = document.getElementById('timer-modal-cancel');
        setTimerBtn.addEventListener('click', () => timerModal.classList.remove('hidden'));
        timerModalCancel.addEventListener('click', () => timerModal.classList.add('hidden'));
        timerModalOk.addEventListener('click', () => {
            const studyMinutes = parseInt(studyTimerInput.value), breakMinutes = parseInt(breakTimerInput.value);
            if (studyMinutes > 0) studyDuration = studyMinutes * 60; if (breakMinutes > 0) breakDuration = breakMinutes * 60;
            remainingTime = (currentMode === 'study') ? studyDuration : breakDuration;
            resetTimer(); timerModal.classList.add('hidden');
        });

        // Resize
        const resizeTimerBtn = document.getElementById('resize-timer-btn'), resizeModal = document.getElementById('resize-modal'), resizeModalOk = document.getElementById('resize-modal-ok'), timerSizeSlider = document.getElementById('timer-size-slider');
        resizeTimerBtn.addEventListener('click', () => resizeModal.classList.remove('hidden'));
        resizeModalOk.addEventListener('click', () => resizeModal.classList.add('hidden'));
        timerSizeSlider.addEventListener('input', (e) => {
            const newSize = e.target.value; document.documentElement.style.setProperty('--timer-font-size', `${newSize}rem`); localStorage.setItem('timerSize', newSize);
        });

        // Question Counter
        toggleQuestionCounterBtn.addEventListener('click', () => questionCounterDisplay.classList.toggle('hidden'));
        questionAddBtn.addEventListener('click', () => { questionCountToday++; questionCountEl.textContent = questionCountToday; saveAllDataToLocalStorage(); });
        questionSubtractBtn.addEventListener('click', () => { if(questionCountToday>0){ questionCountToday--; questionCountEl.textContent = questionCountToday; saveAllDataToLocalStorage(); }});

        // Timer Type
        timerTypeBtn.addEventListener('click', () => {
            if (timerType === 'pomodoro') { timerType = 'stopwatch'; timerTypeBtn.textContent = 'Stopwatch'; elapsedSeconds = 0; }
            else { timerType = 'pomodoro'; timerTypeBtn.textContent = 'Pomodoro'; remainingTime = (currentMode === 'study') ? studyDuration : breakDuration; }
            resetTimer();
        });

        // Adjust Time
        addTimeBtn.addEventListener('click', () => { if (timerType === 'pomodoro') { remainingTime += 300; if (isRunning) pomodoroEndTime += 300000; } else elapsedSeconds += 300; updateTimerDisplay(); });
        subtractTimeBtn.addEventListener('click', () => { if (timerType === 'pomodoro') { remainingTime = Math.max(0, remainingTime - 300); if (isRunning) pomodoroEndTime -= 300000; } else elapsedSeconds = Math.max(0, elapsedSeconds - 300); updateTimerDisplay(); });

        // Fullscreen & UI Hiding
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); });
        document.addEventListener('fullscreenchange', () => {
             if (document.fullscreenElement) { document.getElementById('fullscreen-enter-icon').classList.add('hidden'); document.getElementById('fullscreen-exit-icon').classList.remove('hidden'); } 
             else { document.getElementById('fullscreen-enter-icon').classList.remove('hidden'); document.getElementById('fullscreen-exit-icon').classList.add('hidden'); }
        });

        minimizeBtn.addEventListener('click', () => controlsBar.classList.toggle('ui-hide'));
        const cinemaModeBtn = document.getElementById('cinema-mode-btn');
        cinemaModeBtn.addEventListener('click', () => { [controlsBar, timerWrapper, videoControlsContainer, questionCounterDisplay].forEach(el => el.classList.add('ui-hide')); });
        document.documentElement.addEventListener('click', (e) => {
            if (controlsBar.classList.contains('ui-hide') && e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
                [controlsBar, timerWrapper, questionCounterDisplay].forEach(el => el.classList.remove('ui-hide'));
                if(activeBgPlayer === 'local' || activeBgPlayer === 'youtube') videoControlsContainer.classList.remove('ui-hide');
            }
        });

        // Snow/Rain Animation
        const canvas = document.getElementById('effect-canvas'), ctx = canvas.getContext('2d');
        let particles = [], animationId = null, currentEffect = 'none';
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        class Particle {
            constructor(type) { this.type = type; this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * canvas.width; this.y = initial ? Math.random() * canvas.height : -10;
                if (this.type === 'snow') { this.vy = 1 + Math.random() * 2; this.vx = (Math.random() - 0.5) * 0.5; this.size = Math.random() * 2 + 1; } 
                else { this.vy = 15 + Math.random() * 10; this.vx = 0; this.size = Math.random() * 15 + 10; }
            }
            update() { this.x += this.vx; this.y += this.vy; if (this.y > canvas.height) this.reset(); }
            draw() {
                ctx.beginPath();
                if (this.type === 'snow') { ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); } 
                else { ctx.strokeStyle = 'rgba(174, 214, 241, 0.5)'; ctx.lineWidth = 1.5; ctx.moveTo(this.x, this.y); ctx.lineTo(this.x, this.y + this.size); ctx.stroke(); }
            }
        }
        function startAnimation(type) {
            if (animationId) cancelAnimationFrame(animationId);
            particles = []; currentEffect = type;
            for (let i = 0; i < (type === 'snow' ? 150 : 200); i++) particles.push(new Particle(type));
            animate();
        }
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); animationId = requestAnimationFrame(animate); }
        toggleSnowBtn.addEventListener('click', () => { if(currentEffect === 'snow'){ cancelAnimationFrame(animationId); ctx.clearRect(0,0,canvas.width,canvas.height); currentEffect='none'; toggleSnowBtn.classList.remove('text-blue-400'); } else { startAnimation('snow'); toggleSnowBtn.classList.add('text-blue-400'); toggleRainBtn.classList.remove('text-blue-400'); } });
        toggleRainBtn.addEventListener('click', () => { if(currentEffect === 'rain'){ cancelAnimationFrame(animationId); ctx.clearRect(0,0,canvas.width,canvas.height); currentEffect='none'; toggleRainBtn.classList.remove('text-blue-400'); } else { startAnimation('rain'); toggleRainBtn.classList.add('text-blue-400'); toggleSnowBtn.classList.remove('text-blue-400'); } });

        // Init
        loadDataFromLocalStorage(); rewireControlsForLocalBg(); updateVisualMode(); resetTimer();

    </script>
</body>
</html>
