<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer Zen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fix for fullscreen white line */
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; }

        /* Ensure the video player is a background element */
        #bg-video {
            position: fixed; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%; width: auto; height: auto;
            transform: translateX(-50%) translateY(-50%);
            z-index: -10; pointer-events: none; object-fit: cover;
        }

        /* Background Image Style */
        #bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -5; display: none;
        }

        /* Animation Canvas (Snow/Rain) */
        #effect-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        body { font-family: 'Inter', sans-serif; overflow: hidden; }

        .text-shadow { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); }

        /* Timer Wrapper (Draggable) 
           Z-Index Strategy:
           BG Video: -10
           Canvas: 5
           Timer: 10 (Below controls)
           Controls: 40
           Menus: 50
           Modals: 100
        */
        #timer-wrapper { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); /* Default centered */
            cursor: grab; 
            user-select: none;
            z-index: 10; /* Lowered to sit behind modals/menus */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }
        
        /* Ring Mode Specifics */
        #timer-wrapper.ring-mode {
            aspect-ratio: 1 / 1; /* Force Square for Perfect Circle */
            border-radius: 50%;
            padding: 4rem; /* More padding so ring covers text comfortably */
            background-color: rgba(0, 0, 0, 0.2); /* Slight darkening for readability */
            backdrop-filter: blur(2px);
        }
        
        /* Clean Mode Specifics */
        #timer-wrapper.clean-mode {
            padding: 1rem;
            border-radius: 1rem;
        }

        #timer-wrapper:active { cursor: grabbing; }
        #timer-wrapper:hover { background-color: rgba(255,255,255,0.05); }

        /* Timer Adjust Buttons */
        .time-adjust-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 3rem; font-weight: 200; color: rgba(255, 255, 255, 0.4);
            cursor: pointer; padding: 1rem; opacity: 0;
            transition: opacity 0.2s ease-in-out, color 0.2s ease-in-out; user-select: none;
            z-index: 12; /* Slightly above timer wrapper */
        }
        .time-adjust-btn:hover { color: rgba(255, 255, 255, 0.8); }
        #timer-wrapper:hover .time-adjust-btn { opacity: 1; }
        #subtract-time-btn { left: -60px; }
        #add-time-btn { right: -60px; }

        /* Ring Progress Styles */
        #timer-ring-svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            transform: rotate(-90deg);
            display: block; 
            overflow: visible;
        }
        circle { transition: stroke-dashoffset 0.5s ease; }

        /* Common Control Btn */
        .control-btn { transition: all 0.3s ease; }

        /* Video Seek Bar */
        #video-seek-bar {
            -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
            background: rgba(255, 255, 255, 0.3); border-radius: 3px; outline: none;
            cursor: pointer; transition: height 0.2s ease;
        }
        #video-seek-bar:hover { height: 10px; }
        #video-seek-bar::-webkit-progress-bar { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }
        #video-seek-bar::-webkit-progress-value { background: white; border-radius: 3px; }
        #video-seek-bar::-moz-progress-bar { background: white; border-radius: 3px; }

        /* Resizable Timer */
        #timer-display { 
            font-size: var(--timer-font-size, 8rem); 
            line-height: 0.9; 
            pointer-events: none; 
            white-space: nowrap;
        }

        /* UI Hide */
        .ui-hide { opacity: 0 !important; pointer-events: none !important; transition: opacity 0.3s ease-out; }

        /* Pop-up Menus */
        .popup-menu {
            position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
            background-color: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); padding: 1rem;
            border-radius: 1rem; width: 300px; z-index: 50;
            display: none; flex-direction: column; gap: 0.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .popup-menu.active { display: flex; }

        /* Music Queue Item */
        .queue-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.5rem; border-radius: 0.5rem; background: rgba(255,255,255,0.05);
            font-size: 0.85rem; cursor: pointer; transition: background 0.2s;
        }
        .queue-item:hover { background: rgba(255,255,255,0.1); }
        .queue-item.active-track { background: rgba(59, 130, 246, 0.3); border: 1px solid rgba(59, 130, 246, 0.5); }
    </style>
</head>

    <script type="module">
        // --- 0. App State & Config ---

        // --- MUSIC PLAYER STATE ---

        let isMusicPlaying = false;
        let musicAutoplay = false;

        // --- UI Elements ---

        // --- Question Counter UI ---

        // --- BACKGROUND VIDEO UI ---

        // --- NEW IMAGE & FX UI ---
        const imageFileInput = document.getElementById('image-file-input');

        const toggleSnowBtn = document.getElementById('toggle-snow-btn');
        const toggleRainBtn = document.getElementById('toggle-rain-btn');

        // --- MENU UI ---
        const bgMenuBtn = document.getElementById('bg-menu-btn');

        const musicPauseIcon = document.getElementById('music-pause-icon');
        const musicNextBtn = document.getElementById('music-next-btn');
        const musicPrevBtn = document.getElementById('music-prev-btn');
        const musicMuteBtn = document.getElementById('music-mute-btn');
        const musicUnmuteIcon = document.getElementById('music-unmute-icon');
        const musicMuteIcon = document.getElementById('music-mute-icon');
        const musicAutoplayBtn = document.getElementById('music-autoplay-btn');
        const addMusicYtBtn = document.getElementById('add-music-yt-btn');
        const addMusicLocalBtn = document.getElementById('add-music-local-btn');
        const musicFileInput = document.getElementById('music-file-input');
        const musicQueueList = document.getElementById('music-queue-list');
        const localMusicPlayer = document.getElementById('local-music-player');

        // --- DRAG LOGIC ---
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        timerWrapper.addEventListener('mousedown', (e) => {
            // Don't drag if clicking buttons
            if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
            
            isDragging = true;
            const rect = timerWrapper.getBoundingClientRect();
            // Calculate offset from center of element to mouse
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            dragOffsetX = e.clientX - centerX;
            dragOffsetY = e.clientY - centerY;
            
            timerWrapper.style.cursor = 'grabbing';
            // Remove transform centering to allow free movement, use current computed pixel pos
            timerWrapper.style.transform = 'translate(-50%, -50%)'; 
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            
            // Move based on mouse pos minus offset
            // We keep translate(-50%, -50%) to keep origin at center of element
            const x = e.clientX - dragOffsetX;
            const y = e.clientY - dragOffsetY;
            
            timerWrapper.style.left = `${x}px`;
            timerWrapper.style.top = `${y}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            timerWrapper.style.cursor = 'grab';
        });

        // --- MENU TOGGLE LOGIC ---
        bgMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            bgMenuContainer.classList.toggle('active');
            musicMenuContainer.classList.remove('active'); // Close other
        });
        musicMenuBtn.addEventListener('click', (e) => {
             e.stopPropagation();
            musicMenuContainer.classList.toggle('active');
            bgMenuContainer.classList.remove('active'); // Close other
        });
        document.addEventListener('click', (e) => {
            if (!bgMenuContainer.contains(e.target) && e.target !== bgMenuBtn) {
                bgMenuContainer.classList.remove('active');
            }
             if (!musicMenuContainer.contains(e.target) && e.target !== musicMenuBtn) {
                musicMenuContainer.classList.remove('active');
            }
        });

        // ==========================================
        //  BACKGROUND VIDEO LOGIC
        // ==========================================

        setVideoBtn.addEventListener('click', () => videoFileInput.click());

        videoControlsToggle.addEventListener('click', () => {
            videoControlsContainer.classList.toggle('hidden');
        });

        videoFileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                if (bgVideoPlayer.src) URL.revokeObjectURL(bgVideoPlayer.src);
                const videoURL = URL.createObjectURL(file);
                bgVideoPlayer.src = videoURL;
                bgVideoPlayer.play();
                bgVideoPlayer.muted = true;
                isBgMuted = true;
                updateBgMuteUI();

                activeBgPlayer = 'local';
                bgVideoPlayer.style.display = 'block';
                bgImageEl.style.display = 'none';
                youtubeBgContainer.style.display = 'none';
                if (ytBgPlayer && ytBgPlayer.pauseVideo) ytBgPlayer.pauseVideo();

                videoControlsContainer.classList.remove('hidden');
                rewireControlsForLocalBg();
            }
        });

        setYoutubeBtn.addEventListener('click', () => {
             const url = prompt("Enter YouTube video URL for Background:");
            if (!url) return;
            const idMatch = url.match(/(?:youtube\.com.*(?:\?|&)v=|youtu\.be\/)([^&#]+)/);
            if (!idMatch) return alert("Invalid YouTube URL");
            const videoId = idMatch[1];

            bgVideoPlayer.pause();
            bgVideoPlayer.style.display = 'none';
            bgImageEl.style.display = 'none';
            youtubeBgContainer.style.display = 'block';
            videoControlsContainer.classList.remove('hidden');

            if (ytBgPlayer) {
                activeBgPlayer = 'youtube';
                ytBgPlayer.loadVideoById(videoId);
                rewireControlsForYouTubeBg();
            } else {
                 if (window.YT && window.YT.Player) {
                    createYouTubeBgPlayer(videoId);
                 } else {
                    bgVideoIdToLoad = videoId;
                 }
            }
        });

        // Helper: Format Time
        function formatVideoTime(timeInSeconds) {
            if (isNaN(timeInSeconds)) return "00:00";
            const totalSeconds = Math.floor(timeInSeconds);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // --- Local BG Controls ---
        function localBgTimeUpdate() {
            if (isNaN(bgVideoPlayer.duration)) return;
            videoSeekBar.value = bgVideoPlayer.currentTime;
            videoSeekBar.max = bgVideoPlayer.duration;
            videoTimeDisplay.textContent = `${formatVideoTime(bgVideoPlayer.currentTime)} / ${formatVideoTime(bgVideoPlayer.duration)}`;
        }
        function localBgSeekClick(e) {
            const rect = videoSeekBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            bgVideoPlayer.currentTime = percentage * bgVideoPlayer.duration;
        }
        function localBgPlayPause() {
            if (bgVideoPlayer.paused) bgVideoPlayer.play(); else bgVideoPlayer.pause();
        }
        function onLocalBgPlay() {
            videoPlayIcon.classList.add('hidden'); videoPauseIcon.classList.remove('hidden');
        }
        function onLocalBgPause() {
            videoPlayIcon.classList.remove('hidden'); videoPauseIcon.classList.add('hidden');
        }

        function rewireControlsForLocalBg() {
            if (ytBgSeekBarInterval) clearInterval(ytBgSeekBarInterval);
            videoSeekBar.removeEventListener('click', youtubeBgSeekClick);
            videoPlayPauseBtn.removeEventListener('click', youtubeBgPlayPause);

            bgVideoPlayer.addEventListener('timeupdate', localBgTimeUpdate);
            videoSeekBar.addEventListener('click', localBgSeekClick);
            videoPlayPauseBtn.addEventListener('click', localBgPlayPause);
            bgVideoPlayer.addEventListener('play', onLocalBgPlay);
            bgVideoPlayer.addEventListener('pause', onLocalBgPause);

            if (bgVideoPlayer.paused) onLocalBgPause(); else onLocalBgPlay();
            localBgTimeUpdate();
        }

        // --- YouTube BG Controls ---
        function youtubeBgSeekUpdate() {
            if (ytBgPlayer && ytBgPlayer.getDuration) {
                const duration = ytBgPlayer.getDuration();
                const currentTime = ytBgPlayer.getCurrentTime();
                videoSeekBar.max = duration;
                videoSeekBar.value = currentTime;
                videoTimeDisplay.textContent = `${formatVideoTime(currentTime)} / ${formatVideoTime(duration)}`;
            }
        }
        function youtubeBgSeekClick(e) {
            const rect = videoSeekBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            const newTime = percentage * ytBgPlayer.getDuration();
            ytBgPlayer.seekTo(newTime, true);
        }
        function youtubeBgPlayPause() {
            if (!ytBgPlayer || typeof ytBgPlayer.getPlayerState !== 'function') return;
            const state = ytBgPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) ytBgPlayer.pauseVideo();
            else ytBgPlayer.playVideo();
        }
        function youtubeBgStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                videoPlayIcon.classList.add('hidden'); videoPauseIcon.classList.remove('hidden');
            } else {
                videoPlayIcon.classList.remove('hidden'); videoPauseIcon.classList.add('hidden');
            }
        }

        function rewireControlsForYouTubeBg() {
            if (ytBgSeekBarInterval) clearInterval(ytBgSeekBarInterval);
            bgVideoPlayer.removeEventListener('timeupdate', localBgTimeUpdate);
            videoSeekBar.removeEventListener('click', localBgSeekClick);
            videoPlayPauseBtn.removeEventListener('click', localBgPlayPause);
            bgVideoPlayer.removeEventListener('play', onLocalBgPlay);
            bgVideoPlayer.removeEventListener('pause', onLocalBgPause);

            videoSeekBar.addEventListener('click', youtubeBgSeekClick);
            videoPlayPauseBtn.addEventListener('click', youtubeBgPlayPause);
            ytBgSeekBarInterval = setInterval(youtubeBgSeekUpdate, 500);

            if (ytBgPlayer && typeof ytBgPlayer.getPlayerState === 'function') {
                youtubeBgStateChange({ data: ytBgPlayer.getPlayerState() });
            }
        }

        // --- BG Mute Toggle ---
        function updateBgMuteUI() {
             if (isBgMuted) {
                bgUnmuteIcon.classList.remove('hidden');
                bgMuteIcon.classList.add('hidden');
            } else {
                bgUnmuteIcon.classList.add('hidden');
                bgMuteIcon.classList.remove('hidden');
            }
        }
        bgMuteBtn.addEventListener('click', () => {
            if (activeBgPlayer === 'local') {
                bgVideoPlayer.muted = !bgVideoPlayer.muted;
                isBgMuted = bgVideoPlayer.muted;
            } else if (activeBgPlayer === 'youtube' && ytBgPlayer) {
                if (ytBgPlayer.isMuted()) { ytBgPlayer.unMute(); isBgMuted = false; }
                else { ytBgPlayer.mute(); isBgMuted = true; }
            }
            updateBgMuteUI();
        });


        // ==========================================
        //  MUSIC PLAYER LOGIC
        // ==========================================
        
        function renderMusicQueue() {
            musicQueueList.innerHTML = '';
            if(musicPlaylist.length === 0) {
                 musicQueueList.innerHTML = '<div class="text-xs text-gray-500 text-center italic py-2">Queue is empty</div>';
                 return;
            }
            musicPlaylist.forEach((track, index) => {
                const el = document.createElement('div');
                el.className = `queue-item ${index === currentMusicIndex ? 'active-track' : ''}`;
                el.innerHTML = `
                    <div class="truncate w-48">${index + 1}. ${track.name}</div>
                    <div class="text-xs opacity-50 ml-2">${track.type === 'youtube' ? 'YT' : 'MP3'}</div>
                `;
                el.onclick = () => playMusicTrack(index);
                musicQueueList.appendChild(el);
            });
        }

        function playMusicTrack(index) {
            if (index < 0 || index >= musicPlaylist.length) return;
            currentMusicIndex = index;
            const track = musicPlaylist[index];
            isMusicPlaying = true;
            updateMusicPlayPauseUI();
            renderMusicQueue();

            if (track.type === 'local') {
                // Stop YT Music
                if (ytMusicPlayer && ytMusicPlayer.pauseVideo) ytMusicPlayer.pauseVideo();
                
                localMusicPlayer.src = track.src;
                localMusicPlayer.play();
                localMusicPlayer.muted = isMusicMuted;
            } else {
                // Stop Local
                localMusicPlayer.pause();

                if (ytMusicPlayer) {
                    ytMusicPlayer.loadVideoById(track.src);
                    ytMusicPlayer.setVolume(100);
                    if(isMusicMuted) ytMusicPlayer.mute(); else ytMusicPlayer.unMute();
                } else {
                     if (window.YT && window.YT.Player) {
                        createYouTubeMusicPlayer(track.src);
                     } else {
                        musicVideoIdToLoad = track.src;
                     }
                }
            }
        }

        function updateMusicPlayPauseUI() {
            if(isMusicPlaying) {
                musicPlayIcon.classList.add('hidden');
                musicPauseIcon.classList.remove('hidden');
            } else {
                musicPlayIcon.classList.remove('hidden');
                musicPauseIcon.classList.add('hidden');
            }
        }

        // Music Controls
        musicPlayBtn.addEventListener('click', () => {
            if(musicPlaylist.length === 0) return;
            if(isMusicPlaying) {
                // Pause
                isMusicPlaying = false;
                localMusicPlayer.pause();
                if(ytMusicPlayer && ytMusicPlayer.pauseVideo) ytMusicPlayer.pauseVideo();
            } else {
                // Play
                if (currentMusicIndex === -1) {
                    playMusicTrack(0);
                } else {
                    isMusicPlaying = true;
                    if(musicPlaylist[currentMusicIndex].type === 'local') localMusicPlayer.play();
                    else if (ytMusicPlayer) ytMusicPlayer.playVideo();
                }
            }
            updateMusicPlayPauseUI();
        });

        musicNextBtn.addEventListener('click', () => {
            if(currentMusicIndex < musicPlaylist.length - 1) playMusicTrack(currentMusicIndex + 1);
        });
        musicPrevBtn.addEventListener('click', () => {
            if(currentMusicIndex > 0) playMusicTrack(currentMusicIndex - 1);
        });

        musicMuteBtn.addEventListener('click', () => {
            isMusicMuted = !isMusicMuted;
            localMusicPlayer.muted = isMusicMuted;
            if(ytMusicPlayer) {
                if(isMusicMuted) ytMusicPlayer.mute(); else ytMusicPlayer.unMute();
            }
            if(isMusicMuted) {
                musicMuteIcon.classList.remove('hidden'); musicUnmuteIcon.classList.add('hidden');
            } else {
                musicMuteIcon.classList.add('hidden'); musicUnmuteIcon.classList.remove('hidden');
            }
        });

        musicAutoplayBtn.addEventListener('click', () => {
            musicAutoplay = !musicAutoplay;
            musicAutoplayBtn.textContent = `Autoplay: ${musicAutoplay ? 'ON' : 'OFF'}`;
            musicAutoplayBtn.classList.toggle('bg-blue-600', musicAutoplay);
        });

        // Add Music
        addMusicYtBtn.addEventListener('click', () => {
             const url = prompt("Enter YouTube Music URL:");
            if (!url) return;
            const idMatch = url.match(/(?:youtube\.com.*(?:\?|&)v=|youtu\.be\/)([^&#]+)/);
            if (!idMatch) return alert("Invalid YouTube URL");
            
            musicPlaylist.push({
                type: 'youtube',
                src: idMatch[1],
                name: `YouTube Track ${musicPlaylist.length + 1}`
            });
            renderMusicQueue();
            if(musicPlaylist.length === 1) playMusicTrack(0);
        });

        addMusicLocalBtn.addEventListener('click', () => musicFileInput.click());

        musicFileInput.addEventListener('change', (e) => {
             const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                musicPlaylist.push({
                    type: 'local',
                    src: url,
                    name: file.name
                });
                renderMusicQueue();
                if(musicPlaylist.length === 1) playMusicTrack(0);
            }
        });

        // Autoplay Logic handles
        localMusicPlayer.addEventListener('ended', () => {
            if(musicAutoplay && currentMusicIndex < musicPlaylist.length - 1) {
                playMusicTrack(currentMusicIndex + 1);
            } else {
                isMusicPlaying = false;
                updateMusicPlayPauseUI();
            }
        });


        // ==========================================
        //  YOUTUBE API SETUP (Handles both players)
        // ==========================================
        const ytScript = document.createElement('script');
        ytScript.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(ytScript);

        window.onYouTubeIframeAPIReady = () => {
            // Check pending BG load
            if (bgVideoIdToLoad) {
                createYouTubeBgPlayer(bgVideoIdToLoad);
                bgVideoIdToLoad = null;
            }
            // Check pending Music load
            if (musicVideoIdToLoad) {
                createYouTubeMusicPlayer(musicVideoIdToLoad);
                musicVideoIdToLoad = null;
            }
        };

        function createYouTubeBgPlayer(videoId) {
            ytBgPlayer = new YT.Player('youtube-bg', {
                videoId: videoId,
                playerVars: { autoplay: 1, loop: 1, playlist: videoId, controls: 0, modestbranding: 1, mute: 1, origin: window.location.href },
                events: {
                    onReady: (e) => {
                        activeBgPlayer = 'youtube';
                        e.target.playVideo();
                        rewireControlsForYouTubeBg();
                        isBgMuted = true;
                        updateBgMuteUI();
                    },
                    onStateChange: (e) => youtubeBgStateChange(e)
                }
            });
        }

        function createYouTubeMusicPlayer(videoId) {
            ytMusicPlayer = new YT.Player('music-youtube-player', {
                height: '1', width: '1', // Tiny player
                videoId: videoId,
                playerVars: { autoplay: 1, controls: 0, modestbranding: 1, origin: window.location.href },
                events: {
                    onReady: (e) => {
                        e.target.playVideo();
                        if(isMusicMuted) e.target.mute(); else e.target.unMute();
                    },
                    onStateChange: (e) => {
                        // Handle Autoplay for YouTube
                        if (e.data === YT.PlayerState.ENDED) {
                            if(musicAutoplay && currentMusicIndex < musicPlaylist.length - 1) {
                                playMusicTrack(currentMusicIndex + 1);
                            } else {
                                isMusicPlaying = false;
                                updateMusicPlayPauseUI();
                            }
                        }
                    }
                }
            });
        }


        // ==========================================
        //  CORE TIMER & APP LOGIC (Existing)
        // ==========================================

        function getTodayDateString(date = new Date()) {
            const now = new Date(date.getTime());
            if (now.getHours() < 5) now.setDate(now.getDate() - 1);
            return now.toISOString().split('T')[0];
        }

        function loadDataFromLocalStorage() {
            // Stats
            const savedStatsJSON = localStorage.getItem('studyStats');
            todayDateString = getTodayDateString();
            if (savedStatsJSON) {
                try {
                    const savedStats = JSON.parse(savedStatsJSON);
                    if (savedStats[todayDateString]) {
                        studyTimeToday = savedStats[todayDateString].totalStudy || 0;
                        breakTimeToday = savedStats[todayDateString].totalBreak || 0;
                    }
                } catch (e) {}
            }
            // Size
            const savedTimerSize = localStorage.getItem('timerSize');
            if (savedTimerSize) {
                document.documentElement.style.setProperty('--timer-font-size', `${savedTimerSize}rem`);
                document.getElementById('timer-size-slider').value = savedTimerSize;
            }

            // Questions
            const savedQuestionCountJSON = localStorage.getItem('questionCount');
            if (savedQuestionCountJSON) {
                try {
                    const savedQuestionCount = JSON.parse(savedQuestionCountJSON);
                    if (savedQuestionCount[todayDateString]) questionCountToday = savedQuestionCount[todayDateString] || 0;
                } catch (e) {}
            }
            questionCountEl.textContent = questionCountToday;
        }

        function saveAllDataToLocalStorage() {
            const newToday = getTodayDateString();
            if (newToday !== todayDateString) {
                todayDateString = newToday;
                studyTimeToday = 0;
                breakTimeToday = 0;
                questionCountToday = 0;
            }
            const statsData = { [todayDateString]: { totalStudy: Math.round(studyTimeToday), totalBreak: Math.round(breakTimeToday) } };
            localStorage.setItem('studyStats', JSON.stringify(statsData));
            const questionData = { [todayDateString]: questionCountToday };
            localStorage.setItem('questionCount', JSON.stringify(questionData));
            questionCountEl.textContent = questionCountToday;
        }

        // --- Visual Mode Logic ---
        function updateVisualMode() {
            if (visualMode === 'ring') {
                timerRingSvg.style.display = 'block';
                timerWrapper.classList.add('ring-mode');
                timerWrapper.classList.remove('clean-mode');
            } else {
                timerRingSvg.style.display = 'none';
                timerWrapper.classList.remove('ring-mode');
                timerWrapper.classList.add('clean-mode');
            }
        }
        toggleVisualModeBtn.addEventListener('click', () => {
            visualMode = (visualMode === 'ring') ? 'clean' : 'ring';
            updateVisualMode();
            updateTimerDisplay(); // Redraw progress
        });

        function updateTimerDisplay() {
            let progress = 0;
            
            if (timerType === 'pomodoro') {
                const duration = (currentMode === 'study') ? studyDuration : breakDuration;
                const displayTime = Math.round(remainingTime);
                const minutes = Math.floor(displayTime / 60);
                const seconds = displayTime % 60;
                timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                progress = (displayTime / duration) * 100;
            } else {
                const displayTime = Math.round(elapsedSeconds);
                const hs = Math.floor(displayTime / 3600);
                const ms = Math.floor((displayTime % 3600) / 60);
                const ss = displayTime % 60;
                const hstr = hs > 0 ? `${String(hs).padStart(2, '0')}:` : '';
                timerDisplay.textContent = `${hstr}${String(ms).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
                progress = 0; 
            }

            if (visualMode === 'ring') {
                // Ring progress
                // Circumference is 2 * PI * 45 ≈ 283
                const circumference = 283;
                const offset = circumference - (progress / 100) * circumference;
                timerRingProgress.style.strokeDashoffset = offset;
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');
            lastTickTime = Date.now();

            if (timerType === 'pomodoro') {
                pomodoroEndTime = Date.now() + (remainingTime * 1000);
                timerInterval = setInterval(() => {
                    const now = Date.now();
                    const deltaSeconds = (now - lastTickTime) / 1000.0;
                    lastTickTime = now;
                    if (currentMode === 'study') studyTimeToday += deltaSeconds; else breakTimeToday += deltaSeconds;
                    remainingTime = (pomodoroEndTime - now) / 1000.0;
                    if (remainingTime < 0) remainingTime = 0;
                    updateTimerDisplay();
                    if (now - lastSaveTimestamp > 5000) { saveAllDataToLocalStorage(); lastSaveTimestamp = now; }

                    if (remainingTime <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        alarmSound.play();
                        studyTimeToday = Math.round(studyTimeToday);
                        breakTimeToday = Math.round(breakTimeToday);
                        saveAllDataToLocalStorage();
                        toggleMode();
                        setTimeout(startTimer, 1000);
                    }
                }, 1000);
            } else {
                timerInterval = setInterval(() => {
                    const now = Date.now();
                    const deltaSeconds = (now - lastTickTime) / 1000.0;
                    lastTickTime = now;
                    elapsedSeconds += deltaSeconds;
                    if (currentMode === 'study') studyTimeToday += deltaSeconds; else breakTimeToday += deltaSeconds;
                    if (now - lastSaveTimestamp > 5000) { saveAllDataToLocalStorage(); lastSaveTimestamp = now; }
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            if (!isRunning) return;
            isRunning = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            clearInterval(timerInterval);
            const now = Date.now();
            const deltaSeconds = (now - lastTickTime) / 1000.0;
             if (timerType === 'pomodoro') {
                if (currentMode === 'study') studyTimeToday += deltaSeconds; else breakTimeToday += deltaSeconds;
                remainingTime = (pomodoroEndTime - now) / 1000.0;
                if (remainingTime < 0) remainingTime = 0;
            } else {
                elapsedSeconds += deltaSeconds;
                 if (currentMode === 'study') studyTimeToday += deltaSeconds; else breakTimeToday += deltaSeconds;
            }
            saveAllDataToLocalStorage();
            updateTimerDisplay();
        }

        function resetTimer() {
            pauseTimer();
            if (timerType === 'pomodoro') remainingTime = (currentMode === 'study') ? studyDuration : breakDuration;
            else elapsedSeconds = 0;
            updateTimerDisplay();
        }

        function toggleMode() {
            pauseTimer();
            if (currentMode === 'study') {
                currentMode = 'break';
                remainingTime = breakDuration;
                switchModeBtn.textContent = 'Break';
            } else {
                currentMode = 'study';
                remainingTime = studyDuration;
                switchModeBtn.textContent = 'Study';
            }
            resetTimer();
        }

        switchModeBtn.addEventListener('click', toggleMode);
        playBtn.addEventListener('click', () => isRunning ? pauseTimer() : startTimer());
        resetBtn.addEventListener('click', resetTimer);

        // Timer Modals
        const timerModal = document.getElementById('timer-modal');
        const setTimerBtn = document.getElementById('set-timer-btn');
        const studyTimerInput = document.getElementById('study-timer-input');
        const breakTimerInput = document.getElementById('break-timer-input');
        const timerModalOk = document.getElementById('timer-modal-ok');
        const timerModalCancel = document.getElementById('timer-modal-cancel');

        setTimerBtn.addEventListener('click', () => timerModal.classList.remove('hidden'));
        timerModalCancel.addEventListener('click', () => timerModal.classList.add('hidden'));
        timerModalOk.addEventListener('click', () => {
            const studyMinutes = parseInt(studyTimerInput.value);
            const breakMinutes = parseInt(breakTimerInput.value);
            if (studyMinutes > 0) studyDuration = studyMinutes * 60;
            if (breakMinutes > 0) breakDuration = breakMinutes * 60;
            if (currentMode === 'study') remainingTime = studyDuration; else remainingTime = breakDuration;
            resetTimer();
            timerModal.classList.add('hidden');
        });

        // Resize
        const resizeTimerBtn = document.getElementById('resize-timer-btn');
        const resizeModal = document.getElementById('resize-modal');
        const resizeModalOk = document.getElementById('resize-modal-ok');
        const timerSizeSlider = document.getElementById('timer-size-slider');
        resizeTimerBtn.addEventListener('click', () => resizeModal.classList.remove('hidden'));
        resizeModalOk.addEventListener('click', () => resizeModal.classList.add('hidden'));
        timerSizeSlider.addEventListener('input', (e) => {
            const newSize = e.target.value;
            document.documentElement.style.setProperty('--timer-font-size', `${newSize}rem`);
            localStorage.setItem('timerSize', newSize);
        });

        // Question Counter
        toggleQuestionCounterBtn.addEventListener('click', () => questionCounterDisplay.classList.toggle('hidden'));
        questionAddBtn.addEventListener('click', () => { questionCountToday++; questionCountEl.textContent = questionCountToday; saveAllDataToLocalStorage(); });
        questionSubtractBtn.addEventListener('click', () => { if(questionCountToday>0){ questionCountToday--; questionCountEl.textContent = questionCountToday; saveAllDataToLocalStorage(); }});

        // Timer Type
        timerTypeBtn.addEventListener('click', () => {
            if (timerType === 'pomodoro') { timerType = 'stopwatch'; timerTypeBtn.textContent = 'Stopwatch'; elapsedSeconds = 0; }
            else { timerType = 'pomodoro'; timerTypeBtn.textContent = 'Pomodoro'; remainingTime = (currentMode === 'study') ? studyDuration : breakDuration; }
            resetTimer();
        });

        // Adjust Time
        addTimeBtn.addEventListener('click', () => {
            if (timerType === 'pomodoro') { remainingTime += 300; if (isRunning) pomodoroEndTime += 300000; }
            else elapsedSeconds += 300;
            updateTimerDisplay();
        });
        subtractTimeBtn.addEventListener('click', () => {
            if (timerType === 'pomodoro') { remainingTime -= 300; if (remainingTime < 0) remainingTime = 0; if (isRunning) pomodoroEndTime -= 300000; }
            else { elapsedSeconds -= 300; if (elapsedSeconds < 0) elapsedSeconds = 0; }
            updateTimerDisplay();
        });

        // Fullscreen
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        });
        document.addEventListener('fullscreenchange', () => {
             if (document.fullscreenElement) {
                document.getElementById('fullscreen-enter-icon').classList.add('hidden');
                document.getElementById('fullscreen-exit-icon').classList.remove('hidden');
            } else {
                document.getElementById('fullscreen-enter-icon').classList.remove('hidden');
                document.getElementById('fullscreen-exit-icon').classList.add('hidden');
            }
        });

        // Minimize / Cinema
        minimizeBtn.addEventListener('click', () => controlsBar.classList.toggle('ui-hide'));
        const cinemaModeBtn = document.getElementById('cinema-mode-btn');
        const timerContainerEl = document.getElementById('timer-container'); // Part of wrapper now
        cinemaModeBtn.addEventListener('click', () => {
            [controlsBar, timerWrapper, videoControlsContainer, questionCounterDisplay].forEach(el => el.classList.add('ui-hide'));
        });
        document.documentElement.addEventListener('click', (e) => {
            if (controlsBar.classList.contains('ui-hide')) {
                // If clicking background (not a button)
                if(e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
                    [controlsBar, timerWrapper, questionCounterDisplay].forEach(el => el.classList.remove('ui-hide'));
                    if(activeBgPlayer === 'local' || activeBgPlayer === 'youtube') videoControlsContainer.classList.remove('ui-hide');
                }
            }
        });

        // Top Hour (Removed logic as requested, keeping empty function to prevent errors if called)
        function updateTopHourLeft() {}

        // BG Image Logic
        setImageBtn.addEventListener('click', () => imageFileInput.click());
        imageFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const imgUrl = URL.createObjectURL(file);
                bgImageEl.src = imgUrl;
                bgImageEl.style.display = 'block';
                bgVideoPlayer.style.display = 'none';
                youtubeBgContainer.style.display = 'none';
                if (ytBgPlayer) ytBgPlayer.pauseVideo();
                bgVideoPlayer.pause();
                videoControlsContainer.classList.add('hidden');
            }
        });

        // Snow/Rain
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [], animationId = null, currentEffect = 'none';
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        class Particle {
            constructor(type) { this.type = type; this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : -10;
                if (this.type === 'snow') { this.vy = 1 + Math.random() * 2; this.vx = (Math.random() - 0.5) * 0.5; this.size = Math.random() * 2 + 1; } 
                else { this.vy = 15 + Math.random() * 10; this.vx = 0; this.size = Math.random() * 15 + 10; }
            }
            update() { this.x += this.vx; this.y += this.vy; if (this.y > canvas.height) this.reset(); }
            draw() {
                ctx.beginPath();
                if (this.type === 'snow') { ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); } 
                else { ctx.strokeStyle = 'rgba(174, 214, 241, 0.5)'; ctx.lineWidth = 1.5; ctx.moveTo(this.x, this.y); ctx.lineTo(this.x, this.y + this.size); ctx.stroke(); }
            }
        }
        function startAnimation(type) {
            if (animationId) cancelAnimationFrame(animationId);
            particles = []; currentEffect = type;
            for (let i = 0; i < (type === 'snow' ? 150 : 200); i++) particles.push(new Particle(type));
            animate();
        }
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); animationId = requestAnimationFrame(animate); }
        toggleSnowBtn.addEventListener('click', () => { if(currentEffect === 'snow'){ cancelAnimationFrame(animationId); ctx.clearRect(0,0,canvas.width,canvas.height); currentEffect='none'; toggleSnowBtn.classList.remove('text-blue-400'); } else { startAnimation('snow'); toggleSnowBtn.classList.add('text-blue-400'); toggleRainBtn.classList.remove('text-blue-400'); } });
        toggleRainBtn.addEventListener('click', () => { if(currentEffect === 'rain'){ cancelAnimationFrame(animationId); ctx.clearRect(0,0,canvas.width,canvas.height); currentEffect='none'; toggleRainBtn.classList.remove('text-blue-400'); } else { startAnimation('rain'); toggleRainBtn.classList.add('text-blue-400'); toggleSnowBtn.classList.remove('text-blue-400'); } });

        // Init
        loadDataFromLocalStorage();
        rewireControlsForLocalBg();
        updateVisualMode(); // Set initial look
        resetTimer();

    </script>
</body>
</html>
